<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Rush 3D Pro — 体感急流勇进</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e1a;
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; user-select:none; }
  #gameCanvas { display:block; position:absolute; top:0; left:0; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:15;
    box-shadow: inset 0 0 300px rgba(0,10,30,.5); }
  #speedFx { position:absolute; inset:0; pointer-events:none; z-index:13; opacity:0;
    transition:opacity .4s; background:radial-gradient(ellipse 60% 100% at 50% 50%, transparent 50%, rgba(180,220,255,.1) 100%); }

  /* ===== 摄像头窗口 ===== */
  #camWrap { position:absolute; top:12px; right:12px; width:180px; height:135px;
    border:2px solid rgba(126,152,255,.35); border-radius:12px; overflow:hidden;
    box-shadow:0 4px 18px rgba(2,6,23,.55), inset 0 1px 0 rgba(226,232,255,.08); z-index:20; background:#0a0e1a; }
  #camWrap canvas { width:100%; height:100%; }
  #camLabel { position:absolute; bottom:2px; left:0; right:0; text-align:center;
    font-size:10px; color:rgba(226,232,255,.7); text-shadow:0 1px 3px #000; }
  #poseStatus { position:absolute; top:4px; left:6px; font-size:11px; z-index:21; }

  /* ===== HUD ===== */
  #hud { position:absolute; top:12px; left:12px; z-index:20; display:flex; gap:10px; }
  .hud-box {
    background:linear-gradient(165deg, rgba(19,28,54,.88), rgba(7,11,26,.92));
    border:1px solid rgba(126,152,255,.25); border-radius:10px; padding:5px 14px;
    color:#e6ebf8; text-shadow:0 1px 2px rgba(0,0,0,.7); backdrop-filter:blur(8px);
    box-shadow:0 4px 12px rgba(2,6,23,.35), inset 0 1px 0 rgba(226,232,255,.06);
    min-width:72px; text-align:center;
  }
  .hud-box .label { font-size:9px; opacity:.6; text-transform:uppercase; letter-spacing:1.5px; }
  .hud-box .val { font-size:22px; font-weight:800; line-height:1.15; }
  .hud-score .val { color:#fcd34d; }
  .hud-fps .val { color:#86efac; font-size:14px; min-width:34px; }
  .hud-lives .val { color:#ff6b6b; font-size:18px; letter-spacing:2px; }
  .hud-dist .val { color:#7dd3fc; }

  /* ===== 任务面板 ===== */
  #questPanel {
    position:absolute; top:12px; right:204px; z-index:20;
    background:linear-gradient(165deg, rgba(19,28,54,.92), rgba(7,11,26,.95));
    border:1px solid rgba(126,152,255,.3); border-radius:12px; padding:10px 14px;
    color:#e6ebf8; font-size:12px; min-width:200px; max-width:280px;
    box-shadow:0 8px 24px rgba(2,6,23,.45), 0 0 0 1px rgba(77,107,254,.08), inset 0 1px 0 rgba(226,232,255,.08);
    backdrop-filter:blur(10px);
    animation:quest-panel-in 280ms cubic-bezier(.22,1,.36,1);
  }
  @keyframes quest-panel-in { from{opacity:0;transform:translateY(6px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  #questPanel.hidden { display:none !important; }
  .quest-title {
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px;
    background:linear-gradient(90deg,#a9c1ff,#6c8bff 60%,#4d6bfe);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .quest-item { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .quest-icon { font-size:16px; line-height:1; }
  .quest-text { flex:1; color:#c8d6f0; font-size:11px; line-height:1.4; }
  .quest-progress { font-size:11px; font-weight:700; color:#7dd3fc; white-space:nowrap; }
  .quest-item.done .quest-text { color:#6a7a8a; text-decoration:line-through; }
  .quest-item.done .quest-progress { color:#4ade80; }
  .quest-bar { width:100%; height:4px; border-radius:2px; background:rgba(126,152,255,.15); margin-top:2px; overflow:hidden; }
  .quest-bar-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,#4d6bfe,#7dd3fc); transition:width .3s ease; }
  .quest-item.done .quest-bar-fill { background:linear-gradient(90deg,#22c55e,#4ade80); }

  /* ===== 倾斜指示 ===== */
  #leanBar { position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    width:220px; height:10px; z-index:20; border-radius:6px;
    background:rgba(19,28,54,.6); border:1px solid rgba(126,152,255,.3); backdrop-filter:blur(6px); }
  #leanDot { position:absolute; top:-4px; width:18px; height:18px; border-radius:50%;
    background:linear-gradient(180deg,#ffd23f,#f59e0b); border:2px solid rgba(255,255,255,.8); left:50%; margin-left:-9px;
    transition:left .06s linear; box-shadow:0 2px 8px rgba(255,210,63,.4); }
  #leanHint { position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    z-index:20; font-size:12px; color:rgba(226,232,255,.6); text-shadow:0 1px 2px #000; white-space:nowrap; }

  /* ===== 急流提示 ===== */
  #rapidFx { position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
    z-index:20; font-size:15px; color:#7dd3fc; text-shadow:0 0 12px rgba(125,211,252,.8);
    opacity:0; transition:opacity .3s; font-weight:700; letter-spacing:1px; }
  #comboFx { position:absolute; top:18%; right:6%; z-index:20; font-size:26px; font-weight:900;
    color:#ffd34d; text-shadow:0 0 16px rgba(255,180,60,.9), 0 2px 0 #7a4a00;
    opacity:0; transition:opacity .25s, transform .12s; pointer-events:none; }
  #comboFx.pop { transform:scale(1.25); }
  #qteFx { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); z-index:22;
    font-size:44px; font-weight:900; color:#ffe066; text-shadow:0 0 24px rgba(255,140,0,.95), 0 3px 0 #8a4a00;
    opacity:0; transition:opacity .15s; pointer-events:none; letter-spacing:2px; }
  #qteFx.pulse { animation:qtePulse .35s infinite alternate; }
  @keyframes qtePulse { from { transform:translate(-50%,-50%) scale(1); } to { transform:translate(-50%,-50%) scale(1.18); } }
  #comboFx.pop { transform:scale(1.25); }
  #stageBanner { position:absolute; top:20%; left:50%; transform:translateX(-50%); z-index:21;
    font-size:34px; font-weight:900; color:#fff; text-shadow:0 0 24px rgba(80,160,255,.9), 0 2px 0 rgba(0,0,0,.4);
    opacity:0; transition:opacity .8s; pointer-events:none; letter-spacing:3px; }
  #powerBar { position:absolute; top:64px; left:16px; z-index:20; display:flex; gap:6px; pointer-events:none; }
  #sharkWarn { position:absolute; top:12%; left:50%; transform:translateX(-50%); z-index:21;
    font-size:30px; font-weight:900; color:#ff4455; text-shadow:0 0 20px rgba(255,40,60,.95);
    opacity:0; transition:opacity .2s; pointer-events:none; animation:sharkPulse .4s infinite alternate; display:none; }
  @keyframes sharkPulse { from { transform:translateX(-50%) scale(1); } to { transform:translateX(-50%) scale(1.15); } }
  .pw-item { display:none; flex-direction:column; gap:3px; background:rgba(19,28,54,.8); border:1px solid rgba(126,152,255,.35);
    border-radius:10px; padding:6px 12px; font-size:13px; font-weight:700; color:#cfe0ff; backdrop-filter:blur(4px); min-width:86px; }
  .pw-item.on { display:flex; }
  .pw-item b { font-weight:800; letter-spacing:.5px; }
  .pw-bar { width:100%; height:4px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; }
  .pw-fill { display:block; height:100%; width:100%; background:linear-gradient(90deg,#4dd0ff,#ffd34d); border-radius:2px; }
  .pw-note { font-size:10px; color:#8ea6ff; }

  /* ===== 覆盖层（开始/结束屏） ===== */
  .overlay { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at center,rgba(19,28,54,.85),rgba(5,8,20,.97)); }
  .overlay h1 { font-size:clamp(36px,7vw,72px); font-weight:900; color:#fff;
    text-shadow:0 4px 0 #1a2a5a, 0 8px 28px rgba(77,107,254,.3); margin-bottom:6px; letter-spacing:3px; }
  .overlay h1 span {
    background:linear-gradient(90deg,#ffd23f,#ff8c1a 50%,#ffd23f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay .sub { font-size:clamp(13px,1.8vw,18px); color:#8ea6ff; margin-bottom:24px; max-width:540px; line-height:1.6; }
  .overlay .controls { display:flex; gap:28px; margin-bottom:26px; flex-wrap:wrap; justify-content:center; }
  .ctrl-item { color:#c8d6f0; font-size:13px; max-width:150px;
    background:linear-gradient(165deg,rgba(19,28,54,.6),rgba(7,11,26,.7));
    border:1px solid rgba(126,152,255,.2); border-radius:10px; padding:10px 14px; backdrop-filter:blur(6px); }
  .ctrl-item .ico { font-size:30px; display:block; margin-bottom:4px; }
  .overlay button { font-size:22px; font-weight:800; color:#fff; background:linear-gradient(180deg,#4d6bfe,#3a55e0);
    border:none; border-radius:50px; padding:16px 50px; cursor:pointer;
    box-shadow:0 6px 0 #2a3fb0, 0 10px 28px rgba(77,107,254,.35);
    transition:transform .1s, box-shadow .1s, filter .12s; letter-spacing:2px; }
  .overlay button:hover { filter:brightness(1.1); transform:translateY(-2px); box-shadow:0 8px 0 #2a3fb0, 0 14px 32px rgba(77,107,254,.45); }
  .overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 #2a3fb0; }
  .overlay button:disabled { opacity:.5; cursor:wait; }
  #diffRow { display:flex; gap:10px; margin-bottom:18px; }
  .diff-btn { font-size:15px !important; font-weight:700 !important; padding:8px 22px !important;
    background:rgba(77,107,254,.25) !important; box-shadow:none !important; border:1px solid rgba(126,152,255,.4);
    transform:none !important; }
  .diff-btn.sel { background:linear-gradient(180deg,#4d6bfe,#3a55e0) !important; border-color:#8fa7ff;
    box-shadow:0 0 16px rgba(77,107,254,.6); }
  .overlay .score-line {
    font-size:32px; font-weight:900; margin:8px 0 4px;
    background:linear-gradient(90deg,#ffd23f,#fcd34f 50%,#ffd23f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay .stat-line { font-size:16px; color:#8ea6ff; margin:3px 0; }
  #loadingDots::after { content:''; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
  .hidden { display:none !important; }
  #loadingPct { font-size:14px; color:#8ea6ff; margin-top:8px; }

  /* ===== 通关/任务完成弹窗 ===== */
  #questToast {
    position:absolute; top:50%; right:24px; transform:translateY(-50%) scale(.9);
    z-index:45; opacity:0; pointer-events:none; transition:all .4s cubic-bezier(.22,1,.36,1);
    background:linear-gradient(165deg,rgba(19,28,54,.95),rgba(7,11,26,.97));
    border:1px solid rgba(126,152,255,.4); border-radius:16px; padding:20px 40px;
    box-shadow:0 12px 40px rgba(2,6,23,.6), 0 0 0 1px rgba(77,107,254,.12), inset 0 1px 0 rgba(226,232,255,.1);
    backdrop-filter:blur(12px); text-align:center; max-width:220px;
  }
  #questToast.show { opacity:1; transform:translateY(-50%) scale(1); }
  .toast-icon { font-size:40px; margin-bottom:6px; }
  .toast-title {
    font-size:20px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#a9c1ff,#6c8bff 60%,#4d6bfe);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .toast-reward { font-size:14px; color:#fcd34d; font-weight:700; margin-top:4px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="speedFx"></div>
<div id="vignette"></div>
<div id="camWrap">
  <canvas id="poseCanvas" width="320" height="240"></canvas>
  <div id="camLabel">体感摄像头</div>
  <div id="poseStatus">🔴</div>
</div>
<div id="hud" class="hidden">
  <div class="hud-box hud-score"><div class="label">分数</div><div class="val" id="scoreVal">0</div></div>
  <div class="hud-box hud-lives"><div class="label">生命</div><div class="val" id="lives">🐋🐋🐋</div></div>
  <div class="hud-box hud-dist"><div class="label">距离</div><div class="val" id="distVal">0m</div></div>

</div>
<div id="powerBar" class="hidden">
  <span class="pw-item" id="pw-magnet"><b>🧲 磁铁</b><span class="pw-bar"><span class="pw-fill" id="pwf-magnet"></span></span></span>

  <span class="pw-item" id="pw-double"><b>💰 双倍分数</b><span class="pw-bar"><span class="pw-fill" id="pwf-double"></span></span></span>
</div>
<div id="questPanel" class="hidden">
  <div class="quest-title">🐋 深海任务</div>
  <div id="questList"></div>
</div>
<div id="questToast">
  <div class="toast-icon" id="toastIcon">🏆</div>
  <div class="toast-title" id="toastTitle">任务完成！</div>
  <div class="toast-reward" id="toastReward">+500 分</div>
</div>
<div id="leanHint" class="hidden">← 左右移动身体控制方向 · 向上跳起越障 →</div>
<div id="leanBar" class="hidden"><div id="leanDot"></div></div>
<div id="rapidFx"></div>
<div id="stageBanner"></div>
<div id="qteFx"></div>
<div id="sharkWarn">🦈 鲨鱼来袭——快跳！</div>
<div id="comboFx"></div>
<div id="startScreen" class="overlay">
  <h1>🐋 RIVER <span>RUSH</span></h1>
  <p class="sub">体感急流勇进 · 跟随鲸鱼娘穿越深蓝峡谷<br>左右移动身体控制方向，跳起越障，收集水晶！</p>
  <div class="controls">
    <div class="ctrl-item"><span class="ico">🧍</span>左右移动身体<br>控制筏子方向</div>
    <div class="ctrl-item"><span class="ico">⬆️</span>向上跳起<br>越过障碍</div>
    <div class="ctrl-item"><span class="ico">💎</span>收集水晶<br>完成深海任务</div>
  </div>

    <button class="diff-btn" id="diffEasy">😌 简单</button>
    <button class="diff-btn sel" id="diffNormal">标准</button>
    <button class="diff-btn" id="diffHard">🔥 困难</button>
  </div>
  <button id="startBtn" disabled>加载中<span id="loadingDots"></span></button>
  <div id="loadingPct">正在初始化3D场景...</div>
</div>
<div id="overScreen" class="overlay hidden">
  <h1>🐋 鲸 <span>落</span> 了！</h1>
  <div class="score-line" id="finalScore">0</div>
  <div class="stat-line" id="finalDist">漂流距离：0m</div>
  <div class="stat-line" id="finalCoins">收集水晶：0</div>
  <button id="restartBtn">再来一次</button>
</div>
<div id="pauseOverlay" style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:none;background:rgba(19,28,54,.85);border:1px solid rgba(126,152,255,.3);border-radius:8px;padding:8px 20px;backdrop-filter:blur(6px);">
  <span style="font-size:16px;font-weight:700;color:#a9c1ff;">⏸️ 已暂停 · 按 P 继续</span>
</div>
<!-- 音频 -->
<audio id="bgmAudio" loop preload="auto"><source src="assets/audio/bgm_adventure.mp3" type="audio/mp3"></audio>
<audio id="riverAudio" loop preload="auto"><source src="assets/audio/river_ambient.mp3" type="audio/mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

//==================================================================
// 配置
//==================================================================
const CFG = {
  baseRiverHalfWidth: 9,
  raftMaxOffset: 7,
  cameraHeight: 5,
  cameraBack: 8,
  cameraLookAhead: 16,
  baseSpeed: 16,
  maxSpeed: 38,
  fogColor: 0x6bb6ff,
  fogNear: 800,
  fogFar: 2000,
};

//==================================================================
// DOM
//==================================================================
const gameCanvas = document.getElementById('gameCanvas');
const poseCanvas = document.getElementById('poseCanvas');
const pctx = poseCanvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const scoreVal = document.getElementById('scoreVal');
const livesEl = document.getElementById('lives');
const distVal = document.getElementById('distVal');
const finalScore = document.getElementById('finalScore');
const finalDist = document.getElementById('finalDist');
const finalCoins = document.getElementById('finalCoins');
const leanBar = document.getElementById('leanBar');
const leanDot = document.getElementById('leanDot');
const leanHint = document.getElementById('leanHint');
const hud = document.getElementById('hud');
const poseStatus = document.getElementById('poseStatus');
const speedFx = document.getElementById('speedFx');
const loadingPct = document.getElementById('loadingPct');
const rapidFx = document.getElementById('rapidFx');
const pauseOverlay = document.getElementById('pauseOverlay');

//==================================================================
// 状态
//==================================================================
const ST = { LOADING:0, READY:1, PLAYING:2, PAUSED:3, OVER:4 };
let gameState = ST.LOADING;
const keys = {};
const bgmAudio = document.getElementById('bgmAudio');
const riverAudio = document.getElementById('riverAudio');
bgmAudio.volume = 0.35;
riverAudio.volume = 0;
window.addEventListener('keydown', e => { keys[e.key] = true; if(e.key===' ') e.preventDefault();
  // 空格跳跃——体感不可用时的备用输入
  if(e.key===' ' && gameState===ST.PLAYING && raftState.onWater) { raftState.vy=12; raftState.onWater=false; raftState.bounceT=0.3; }
  if(e.key==='p' || e.key==='P' || e.key==='Escape') {
    if(gameState===ST.PLAYING) { gameState=ST.PAUSED; bgmAudio.pause(); riverAudio.pause(); }
    else if(gameState===ST.PAUSED) { gameState=ST.PLAYING; bgmAudio.play(); riverAudio.play(); }
  }
  // M键静音/取消静音
  if(e.key==='m' || e.key==='M') {
    bgmAudio.muted = !bgmAudio.muted;
    riverAudio.muted = !riverAudio.muted;
    console.log('静音:', bgmAudio.muted ? '🔇 开' : '🔊 关');
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
const poseData = { detected:false, lean:0, prevLean:0, leanVel:0, jumpImpulse:false, smoothHipX:0.5, baselineY:0.5, inJump:false, jumpCD:0, jumpEndTime:0,
  // 手臂角度（弧度）：armLZ/armRZ = 手臂角度(0=向下), elbowL/elbowR = 肘弯曲量
  armLZ: Math.PI/2, armRZ: Math.PI/2, elbowL: 0, elbowR: 0
};

//==================================================================
// 弯曲河流路径函数（核心：定义河流的弯曲和宽窄变化）
//==================================================================
// 河流曲线滚动相位——随玩家前进，让河流弯曲真正"迎面而来"
let riverPhase = 0;

// 河流中心线X偏移——大弯(低频大幅) + 急弯(高频小幅) + 微弯
// riverPhase 让曲线随玩家前进滚动，真正感受到转弯
function riverCenterX(z) {
  const sz = z + riverPhase;
  return Math.sin(sz * 0.012) * 20           // 大弯：幅度20
       + Math.sin(sz * 0.035 + 1.5) * 10    // 急弯：幅度10
       + Math.sin(sz * 0.06 + 0.7) * 4;     // 微弯：幅度4
}
// 河流半宽（随z变化而宽窄交替）
function riverHalfWidth(z) {
  const sz = z + riverPhase;
  const base = CFG.baseRiverHalfWidth;
  const variation = Math.sin(sz * 0.03) * 4 + Math.sin(sz * 0.06 + 0.7) * 2;
  return Math.max(4.5, base + variation);
}
// 河流方向角度（用于相机朝向）
function riverDirection(z) {
  const dz = 0.5;
  const dx = riverCenterX(z - dz) - riverCenterX(z + dz);
  return Math.atan2(dx, dz * 2);
}
// 瀑布：真实高度落差——阶梯式下降，瀑布前方高，后方低并保持
// 瀑布位置随世界滚动（和植被一样）
const WATERFALL_SPACING = 1200;
const WATERFALL_HALF_WIDTH = 10; // 6→10: 落差区间更宽，瀑布变成平滑流水斜面(原本±6太窄,网格采样出折角)
const WATERFALL_DROP = 14; // 高度增加一倍(7→14)

// 滚动中的瀑布Z位置——初始放在玩家前方
let waterfallZList = [-1200, -2400, -3600]; // 3个瀑布，间距1200

function isWaterfallZone(z) {
  for (const wfz of waterfallZList) {
    if (Math.abs(z - wfz) < WATERFALL_HALF_WIDTH) return true;
  }
  return false;
}
function isWaterfallZ(z) { return isWaterfallZone(z); }

// 瀑布高度偏移——阶梯式：瀑布前方高，经过瀑布后下降，然后逐渐回升
// 这样不会无限下降，也不会突然升回来
function waterfallHeightOffset(z) {
  let offset = 0;
  for (const wfz of waterfallZList) {
    const dz = z - wfz; // 正=瀑布前方（高处），负=瀑布后方（低处）
    const range = WATERFALL_HALF_WIDTH;
    const RISE_DIST = 80; // 瀑布后方逐渐回升的距离（长距离，看起来像河流缓流）
    if (dz > range) {
      // 瀑布前方：不降
      offset += 0;
    } else if (dz > -range) {
      // 瀑布中心：smoothstep 从 0 降到 DROP
      const t = (dz + range) / (range * 2);
      const smooth = t * t * (3 - 2 * t);
      offset += WATERFALL_DROP * (1 - smooth);
    } else {
      // 瀑布后方：从 DROP 逐渐回升到 0
      const riseT = Math.max(0, Math.min(1, (-dz - range) / RISE_DIST));
      const riseSmooth = riseT * riseT * (3 - 2 * riseT);
      offset += WATERFALL_DROP * (1 - riseSmooth);
    }
  }
  return offset;
}
function waterfallY(z) { return -waterfallHeightOffset(z); }
function waterfallHeight(z) { return waterfallY(z); }

// 滚动瀑布位置（每帧调用）
function scrollWaterfalls(scrollDist) {
  for (let i = 0; i < waterfallZList.length; i++) {
    waterfallZList[i] += scrollDist;
    if (waterfallZList[i] > 50) {
      // 瀑布滚到玩家后方，回收到最前方——重置高度
      waterfallZList[i] -= WATERFALL_SPACING * waterfallZList.length;
    }
  }
}

  c.width = 512; c.height = 512;
  const cx = c.getContext('2d');
  cx.fillStyle = '#8080ff'; cx.fillRect(0, 0, 512, 512);
  const img = cx.getImageData(0, 0, 512, 512);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = (Math.random()-0.5)*80+128; img.data[i+1] = (Math.random()-0.5)*80+128; img.data[i+2] = 255; img.data[i+3] = 255;
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
// 皮肤纹理
function makeSkinTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const cx = c.getContext('2d');
  cx.fillStyle = '#f4c896'; cx.fillRect(0, 0, 256, 256);
  const img = cx.getImageData(0, 0, 256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 15;
    img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
    img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

//==================================================================
// 弯曲峡谷地形（跟随河流路径 + 宽窄变化 + 瀑布落差）
//==================================================================
function terrainHeight(x, z) {
  const cx = riverCenterX(z);
  const hw = riverHalfWidth(z);
  const distFromRiver = Math.abs(x - cx) - hw;
  const d = Math.max(0, distFromRiver);
  let h = 0;
  h += Math.min(d * d * 0.04, 14);
  h += Math.sin(z * 0.015) * Math.min(d * 0.3, 1.0);
  // 瀑布落差——地形在瀑布后方下降
  h -= waterfallHeightOffset(z);
  return h;
}

function createCanyonTerrain() {
  const len = 600, segs = 400, wid = 80, wSegs = 20; // segs 150→400: 瀑布落差区平滑
  const overlap = 4; // 地形延伸进河道内部的量，确保与水面重叠无缝隙
  const positions = [], uvs = [], colors = [], indices = [];
  for (let i = 0; i <= segs; i++) {
    for (let j = 0; j <= wSegs; j++) {
      const z = (i / segs) * len - len / 2;
      // 左岸——从河道内部(overlap)开始，向外延伸到 wid
      const leftX = riverCenterX(z) - riverHalfWidth(z) + overlap - (j / wSegs) * (wid + overlap);
      let leftY;
      if (j === 0) {
        // 河岸内边缘：下沉到水面以下，形成河岸壁（加上瀑布落差）
        leftY = -1.5 - waterfallHeightOffset(z);
      } else {
        leftY = terrainHeight(leftX, z);
      }
      positions.push(leftX, leftY, z);
      uvs.push((j / wSegs) * 3, (i / segs) * 10);
      // 河岸边缘（低Y）用草地色，高处用岩石色，中间平滑过渡
      const grass = Math.min(1, Math.max(0.3, (leftY + 1) / 6));
      const rock = 1 - grass;
      colors.push(0.40*rock+0.45*grass, 0.34*rock+0.65*grass, 0.26*rock+0.20*grass);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < wSegs; j++) {
      const a = i * (wSegs + 1) + j;
      const b = a + 1, c = a + (wSegs + 1), d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  // 右岸
  const baseIdx = positions.length / 3;
  for (let i = 0; i <= segs; i++) {
    for (let j = 0; j <= wSegs; j++) {
      const z = (i / segs) * len - len / 2;
      const rightX = riverCenterX(z) + riverHalfWidth(z) - overlap + (j / wSegs) * (wid + overlap);
      let rightY;
      if (j === 0) {
        rightY = -1.5 - waterfallHeightOffset(z);
      } else {
        rightY = terrainHeight(rightX, z);
      }
      positions.push(rightX, rightY, z);
      uvs.push((j / wSegs) * 3, (i / segs) * 10);
      const grass = Math.min(1, Math.max(0.3, (rightY + 1) / 6));
      const rock = 1 - grass;
      colors.push(0.40*rock+0.45*grass, 0.34*rock+0.65*grass, 0.26*rock+0.20*grass);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < wSegs; j++) {
      const a = baseIdx + i * (wSegs + 1) + j;
      const b = a + 1, c = a + (wSegs + 1), d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.98, metalness: 0.0,
    map: grassTex, normalMap: rockNormal.clone(),
    normalScale: new THREE.Vector2(0.3, 0.3),
    envMapIntensity: 0.15,
    side: THREE.DoubleSide, // 双面渲染，防止从侧面看穿
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.userData.terrainSegments = { len, segs, wid, wSegs };
  return mesh;
}
const canyonTerrain = createCanyonTerrain();
scene.add(canyonTerrain);

// 预加载 Quaternius 风格化自然模型
const natureModels = {};
const natureLoader = new GLTFLoader();
const NATURE_FILES = [
  'CommonTree_1', 'CommonTree_2', 'CommonTree_3',
  'PineTree_1', 'PineTree_2',
  'PalmTree_1', 'PalmTree_2',
  'BirchTree_1', 'BirchTree_2',
  'Bush_1', 'Bush_2', 'BushBerries_1',
  'Rock_1', 'Rock_2', 'Rock_Moss_1', 'Rock_Moss_2',
  'Grass', 'Grass_2', 'Grass_Short',
  'Flowers', 'Plant_1', 'Plant_2',
  'TreeStump', 'TreeStump_Moss',
  'WoodLog', 'WoodLog_Moss', 'Lilypad',
];
let natureLoaded = 0;
const natureTotal = NATURE_FILES.length;

function loadNatureModels() {
  const promises = [];
  for (const name of NATURE_FILES) {
    promises.push(new Promise((resolve) => {
      natureLoader.load(
        `assets/models/nature/${name}.glb`,
        (gltf) => {
          const model = gltf.scene;
          // 实测原始包围盒高度, 供真实比例换算
          const bb = new THREE.Box3().setFromObject(model);
          model.userData.h0 = Math.max(0.01, bb.max.y - bb.min.y);
          model.traverse(o => {
            if (o.isMesh) {
              o.castShadow = true; o.receiveShadow = true;
              if (o.material) {
                o.material.envMapIntensity = 0; // 关掉环境光反射
                o.material.roughness = 1.0; // 完全哑光
                // 提亮绿色：如果材质有颜色，向嫩绿偏移
                const col = o.material.color;
                if (col) {
                  const r = col.r, g = col.g, b = col.b;
                  // 判断是否偏绿（g > r 且 g > b）
                  if (g > r && g > b) {
                    // 提亮：增加G，减少B，适度增加R
                    col.r = Math.min(1, r * 1.3 + 0.05);
                    col.g = Math.min(1, g * 1.15 + 0.1);
                    col.b = Math.min(1, b * 0.7);
                  }
                  // 仅睡莲: 花朵材质metalness 0.4×哑光处理=黑, 归零+粉色提亮
                  if (name === 'Lilypad') {
                    o.material.metalness = 0;
                    if (r > g && r > b) {
                      col.r = Math.min(1, r * 1.6 + 0.1);
                      col.g = Math.min(1, g * 1.4 + 0.04);
                      col.b = Math.min(1, b * 1.5 + 0.08);
                    }
                  }
                }
              }
            }
          });
          natureModels[name] = model;
          natureLoaded++;
          resolve();
        },
        undefined,
        (err) => { console.warn(`Failed to load ${name}.glb`, err); natureLoaded++; resolve(); }
      );
    }));
  }
  return Promise.all(promises);
}

// 物种真实世界目标高度(游戏单位): 参照人物1.55单位≈1.7m
// 树: 乔木10~18m / 灌木1.5m / 花0.5m / 草0.4~0.7m / 岩石1m / 残桩0.7m / 睡莲0.5m
const VEG_REAL_H = {
  CommonTree_1: 12.5, CommonTree_2: 14, CommonTree_3: 13,
  PineTree_1: 15.5, PineTree_2: 17,
  PalmTree_1: 10.5, PalmTree_2: 12,
  BirchTree_1: 14, BirchTree_2: 15.5,
  Bush_1: 1.4, Bush_2: 1.6, BushBerries_1: 1.5,
  Rock_1: 0.9, Rock_2: 1.2, Rock_Moss_1: 1.0, Rock_Moss_2: 1.3,
  Grass: 0.45, Grass_2: 0.6, Grass_Short: 0.35,
  Flowers: 0.4, Plant_1: 0.9, Plant_2: 1.1,
  TreeStump: 0.65, TreeStump_Moss: 0.7,
  WoodLog: 0.6, WoodLog_Moss: 0.6,
  Lilypad: 0.5,
};
// 换算缩放 = 目标真实高度 / 模型原始高度 × 随机幅度
function vegScaleFor(name, jitter) {
  const m = natureModels[name];
  const target = VEG_REAL_H[name] || 2;
  const h0 = (m && m.userData.h0) || target;
  return (target / h0) * jitter;
}

function cloneNature(name) {
  const src = natureModels[name];
  if (!src) return null;
  const c = src.clone(true);
  c.userData.natureName = name; // 记录模型名，供障碍物区分 WoodLog/TreeStump
  c.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      if (o.material) {
        o.material.envMapIntensity = 0;
        const col = o.material.color;
        if (col) {
          const r = col.r, g = col.g, b = col.b;
          if (g > r && g > b) {
            col.r = Math.min(1, r * 1.3 + 0.05);
            col.g = Math.min(1, g * 1.15 + 0.1);
            col.b = Math.min(1, b * 0.7);
          }
          // 仅睡莲: metalness归零+粉色提亮(同加载源)
          if (name === 'Lilypad') {
            o.material.metalness = 0;
            if (r > g && r > b) {
              col.r = Math.min(1, r * 1.6 + 0.1);
              col.g = Math.min(1, g * 1.4 + 0.04);
              col.b = Math.min(1, b * 1.5 + 0.08);
            }
          }
        }
      }
    }
  });
  return c;
}
function randomNature(category) {
  let pool;
  if (category === 'tree') pool = ['CommonTree_1','CommonTree_2','CommonTree_3','PineTree_1','PineTree_2','PalmTree_1','PalmTree_2','BirchTree_1','BirchTree_2'];
  else if (category === 'bush') pool = ['Bush_1','Bush_2','BushBerries_1','Plant_1','Plant_2','Flowers'];
  else if (category === 'flower') pool = ['Flowers','Flowers','Plant_1','Plant_2'];
  else if (category === 'grass') pool = ['Grass','Grass_2','Grass_Short'];
  else if (category === 'rock') pool = ['Rock_1','Rock_2','Rock_Moss_1','Rock_Moss_2'];
  else if (category === 'log') pool = ['WoodLog','WoodLog_Moss','TreeStump','TreeStump_Moss'];
  else if (category === 'lilypad') pool = ['Lilypad'];
  else pool = ['Plant_1','Plant_2','Flowers','Grass'];
  // 过滤掉还没加载完的
  pool = pool.filter(n => natureModels[n]);
  if (pool.length === 0) return null;
  return cloneNature(pool[Math.floor(Math.random() * pool.length)]);
}

const vegObjects = [];
function placeVegetation() {
  // 第一批：远处的树木（稀疏大树）
  for (let i = 0; i < 120; i++) {
    const r = Math.random();
    const cat = r < 0.3 ? 'tree' : r < 0.6 ? 'tree' : r < 0.85 ? 'bush' : 'grass';
    let veg = randomNature(cat);
    if (!veg) continue; // GLB加载完才放，不需要fallback
    const side = i % 2 === 0 ? -1 : 1;
    const baseZ = -290 + (i / 120) * 580 + (Math.random()-0.5) * 5;
    const xOff = 0.5 + Math.random() * 12;
    const cx = riverCenterX(baseZ);
    const hw = riverHalfWidth(baseZ);
    const x = cx + side * (hw + xOff);
    const y = terrainHeight(x, baseZ);
    const s = vegScaleFor(veg.userData.natureName, 0.85 + Math.random() * 0.35);
    veg.position.set(x, y, baseZ);
    veg.scale.setScalar(s);
    veg.rotation.y = Math.random() * Math.PI * 2;
    veg.userData = { baseZ, side, xOff };
    scene.add(veg);
    vegObjects.push(veg);
  }
  // 第二批：河岸边缘植被（稀疏）
  for (let i = 0; i < 120; i++) {
    const r = Math.random();
    const cat = r < 0.4 ? 'bush' : r < 0.7 ? 'grass' : 'tree';
    let veg = randomNature(cat);
    if (!veg) continue;
    const side = i % 2 === 0 ? -1 : 1;
    const baseZ = -290 + Math.random() * 580;
    const xOff = 0.3 + Math.random() * 4;
    const cx = riverCenterX(baseZ);
    const hw = riverHalfWidth(baseZ);
    const x = cx + side * (hw + xOff);
    const y = terrainHeight(x, baseZ);
    const s = vegScaleFor(veg.userData.natureName, 0.8 + Math.random() * 0.4);
    veg.position.set(x, y, baseZ);
    veg.scale.setScalar(s);
    veg.rotation.y = Math.random() * Math.PI * 2;
    veg.userData = { baseZ, side, xOff };
    scene.add(veg);
    vegObjects.push(veg);
  }
  // 河岸边缘花朵
  for (let i = 0; i < 80; i++) {
    let flower = randomNature('flower');
    if (!flower) continue;
    const side = i % 2 === 0 ? -1 : 1;
    const baseZ = -290 + Math.random() * 580;
    const xOff = 0.2 + Math.random() * 3;
    const cx = riverCenterX(baseZ);
    const hw = riverHalfWidth(baseZ);
    const x = cx + side * (hw + xOff);
    const y = terrainHeight(x, baseZ);
    flower.position.set(x, y, baseZ);
    flower.scale.setScalar(vegScaleFor(flower.userData.natureName, 0.8 + Math.random() * 0.4));
    flower.rotation.y = Math.random() * Math.PI * 2;
    flower.userData = { baseZ, side, xOff };
    scene.add(flower);
    vegObjects.push(flower);
  }
  // 河岸岩石
  for (let i = 0; i < 70; i++) {
    let rock = randomNature('rock');
    if (!rock) {
      const rg = new THREE.IcosahedronGeometry(0.5+Math.random()*0.8, 0);
      const pos = rg.attributes.position;
      for (let j = 0; j < pos.count; j++) {
        pos.setXYZ(j, pos.getX(j)+(Math.random()-0.5)*0.2, pos.getY(j)+(Math.random()-0.5)*0.2, pos.getZ(j)+(Math.random()-0.5)*0.2);
      }
      rg.computeVertexNormals();
      rock = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ color: 0x6a7080, roughness: 0.85, flatShading: true }));
    }
    const side = i % 2 === 0 ? -1 : 1;
    const baseZ = -290 + Math.random() * 580;
    const xOff = Math.random() * 2;
    const cx = riverCenterX(baseZ);
    const hw = riverHalfWidth(baseZ);
    const x = cx + side * (hw + xOff);
    rock.position.set(x, 0.2+Math.random()*0.3, baseZ);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.scale.setScalar(vegScaleFor(rock.userData.natureName, 0.8 + Math.random() * 0.6));
    rock.castShadow = true; rock.receiveShadow = true;
    rock.userData = { baseZ, side, xOff };
    scene.add(rock);
    vegObjects.push(rock);
  }
  // 水面睡莲（少量）
  for (let i = 0; i < 30; i++) {
    let lily = randomNature('lilypad');
    if (!lily) continue;
    const baseZ = -290 + Math.random() * 580;
    const cx = riverCenterX(baseZ);
    const hw = riverHalfWidth(baseZ);
    const x = cx + (Math.random()*2-1) * (hw - 1.5);
    lily.position.set(x, 0.05, baseZ);
    lily.scale.setScalar(vegScaleFor(lily.userData.natureName, 0.6 + Math.random() * 0.5));
    lily.rotation.y = Math.random() * Math.PI * 2;
    lily.userData = { baseZ, side: 0, xOff: (Math.random()*2-1) };
    scene.add(lily);
    vegObjects.push(lily);
  }
}

function createRaft() {
  const g = new THREE.Group();
  // 橡皮材质：哑光+轻微高光=充气橡胶质感

// 重映射动画 clip 的 track 名称
function remapAnimationClip(clip) {
  const newTracks = [];
  let matched = 0, skipped = 0;
  for (const track of clip.tracks) {
    const dotIdx = track.name.lastIndexOf('.');
    if (dotIdx < 0) { newTracks.push(track); continue; }
    let boneName = track.name.substring(0, dotIdx);
    const property = track.name.substring(dotIdx);
    // FBX track names may use 'mixamo.com::BoneName' or 'mixamo.com:BoneName' or 'mixamorig:BoneName'
    // Normalize: strip any prefix before '::' or known prefixes
    if (boneName.startsWith('mixamo.com::')) boneName = boneName.substring(12);
    else if (boneName.startsWith('mixamo.com:')) boneName = boneName.substring(11);
    else if (boneName.startsWith('mixamorig:')) boneName = boneName.substring(10);
    const newName = BONE_REMAP[boneName] || BONE_REMAP['mixamorig:' + boneName];
    if (newName) {
      const newTrack = track.clone();
      newTrack.name = newName + property;
      newTracks.push(newTrack);
      matched++;
    } else {
      if (skipped < 3) console.log(`  Remap skip: "${track.name}" → boneName="${boneName}"`);
      skipped++;
    }
  }
  console.log(`Remap ${clip.name}: ${matched} matched, ${skipped} skipped, ${newTracks.length} total`);
  return new THREE.AnimationClip(clip.name, clip.duration, newTracks, clip.blendMode);
}

      // nonPBR 材质转成 MeshStandardMaterial
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const mat of mats) {
          if (mat.isMeshPhongMaterial || mat.isMeshLambertMaterial) {
            const oldMat = mat;
            const newMat = new THREE.MeshStandardMaterial({
              map: oldMat.map || null,
              color: oldMat.color ? oldMat.color.clone().multiplyScalar(4.0) : new THREE.Color(0xffffff),
              roughness: 1.0,
              metalness: 0.0,
              envMapIntensity: 0.3,
            });
            o.material = newMat;
          }
        }
      }

  });

  // 查找骨骼（用于身体倾斜）
  characterModel.traverse(o => {
    if (o.isBone) charBones[o.name] = o;
    if (o.isSkinnedMesh && o.skeleton) {
      for (const bone of o.skeleton.bones) {
        if (!charBones[bone.name]) charBones[bone.name] = bone;
      }
    }

  mixer = new THREE.AnimationMixer(characterModel);

  if (!characterModel || !characterModel.userData.clips) return;
  const clips = characterModel.userData.clips;

  if (!next || next === currentAction) return;
  currentAction?.fadeOut(0.2);
  next.reset().fadeIn(0.2).play();
  currentAction = next;
}

  // 硬币盘: Cylinder(轴向Y)转x90°立起盘面朝±Z; 材质数组[侧缘, 正面, 背面]
  const disc = new THREE.Mesh(

  if (coinGlyphGeo) {

    vertexShader: `
      varying vec3 vN; varying vec3 vV;
      void main() {
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity;

  glow.renderOrder = 6;
  g.add(glow);
  g.userData.glow = glow;

}

class ParticleSystem {
  constructor(count, color, size) {
    this.count = count;
    this.positions = new Float32Array(count*3);
    this.velocities = new Float32Array(count*3);
    this.lifetimes = new Float32Array(count);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
    const mat = new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    this.mesh = new THREE.Points(geo, mat);
    this.mesh.frustumCulled = false; scene.add(this.mesh);
  }
  emit(x,y,z,n,spread,up) {
    let e=0;
    for (let i=0; i<this.count && e<n; i++) {
      if (this.lifetimes[i] <= 0) {
        this.positions[i*3]=x; this.positions[i*3+1]=y; this.positions[i*3+2]=z;
        this.velocities[i*3]=(Math.random()-0.5)*spread; this.velocities[i*3+1]=Math.random()*up+up*0.3; this.velocities[i*3+2]=(Math.random()-0.5)*spread;
        this.lifetimes[i]=0.8+Math.random()*0.5; e++;
      }
    }
  }
  emitRain(x,y,z,n) { // 雨点式: 水滴从筏子上方落下, 溅到人物和橡皮筏上
    let e=0;
    for (let i=0; i<this.count && e<n; i++) {
      if (this.lifetimes[i] <= 0) {
        this.positions[i*3]=x+(Math.random()-0.5)*5;
        this.positions[i*3+1]=y+2.5+Math.random()*3.5;
        this.positions[i*3+2]=z+(Math.random()-0.5)*4;
        this.velocities[i*3]=(Math.random()-0.5)*2.5;
        this.velocities[i*3+1]=-1-Math.random()*2; // 向下落
        this.velocities[i*3+2]=(Math.random()-0.5)*2.5+4; // 带前飘
        this.lifetimes[i]=0.9+Math.random()*0.6; e++;
      }
    }
  }
  update(dt) {
    for (let i=0; i<this.count; i++) {
      if (this.lifetimes[i]>0) {
        this.lifetimes[i]-=dt;
        this.positions[i*3]+=this.velocities[i*3]*dt; this.positions[i*3+1]+=this.velocities[i*3+1]*dt; this.positions[i*3+2]+=this.velocities[i*3+2]*dt;
        this.velocities[i*3+1]-=20*dt;
      } else this.positions[i*3+1]=-300;
    }
    this.mesh.geometry.attributes.position.needsUpdate = true;
  }
}

// 相机（沿弯曲河流路径前瞻）
//==================================================================
const camState = { pos: new THREE.Vector3(0, CFG.cameraHeight, CFG.cameraBack), shakeT: 0, bobPhase: 0, overhead: 0, prevWfY: 0, overheadHold: 0, prevFalling: false, impactHold: 0, impact: 0 };
function updateCamera(dt, time) {
  const raftZ = 0;
  const raftCx = riverCenterX(raftZ);
  const backZ = raftZ + CFG.cameraBack;
  const camCx = riverCenterX(backZ);
  const camDir = riverDirection(backZ);
  // 相机高度跟随瀑布落差——防止人物丢失
  const wfY = waterfallY(raftZ);

  // 船体下落时切换俯视视角——检测waterfallY的下降速率
  const wfDelta = wfY - camState.prevWfY;
  camState.prevWfY = wfY;
  // wfDelta < 0 说明水面在下降（船在下落）→ 俯视，并保持hold计时
  if (wfDelta < -0.02) {
    camState.overheadHold = 0.5; // 下落结束后再保持0.5秒
  } else {
    camState.overheadHold -= dt; // 倒计时
  }
  // 只有hold>0时才保持俯瞰，hold结束后恢复（恢复速度更慢）
  const wantOverhead = camState.overheadHold > 0 ? 1 : 0;
  const lerpSpeed = wantOverhead > camState.overhead ? 4 : 1.2;
  camState.overhead += (wantOverhead - camState.overhead) * dt * lerpSpeed;
  const ov = camState.overhead;

  // 落水瞬间: 从下落→停止 = 冲击水面 → 大水花+震屏+2秒障碍物冻结
  // 同时取消俯瞰保持, 切入落水近景(快速压近=冲击感)
  const falling = wfDelta < -0.02;
  if (camState.prevFalling && !falling && wfY < -2) {
    splashParticles.emit(raft.position.x, 0.3, raft.position.z, 150, 12, 15); // 大爆溅(细颗粒×多数量)
    splashParticles.emitRain(raft.position.x, raft.position.y, raft.position.z, 90); // 雨点落到筏上
    camState.shakeT = 0.55;
    camState.impactHold = 0.75;   // 落水近景保持0.75秒
    camState.overheadHold = 0;    // 取消俯瞰保持
  }
  camState.prevFalling = falling;
  if (camState.impactHold > 0) camState.impactHold -= dt;
  const wantImpact = camState.impactHold > 0 ? 1 : 0;
  const iLerp = wantImpact > camState.impact ? 9 : 1.6; // 压近快(9), 恢复慢(1.6)
  camState.impact += (wantImpact - camState.impact) * dt * iLerp;
  const iv = camState.impact;

  // 正常相机位置（第三人称追逐）
  const tx = camCx + Math.sin(camDir) * 2;
  const ty = CFG.cameraHeight + wfY + raftState.y * 0.25;
  const tz = CFG.cameraBack;
  // 下落中: 原高空俯瞰逻辑(不变)
  const ovTx = raftCx;
  const ovTy = CFG.cameraHeight + 12 + wfY;
  const ovTz = CFG.cameraBack - 3;
  // 落水近景: 贴着落水池水面的低机位
  const imTx = raftCx;
  const imTy = wfY + 2.2;
  const imTz = CFG.cameraBack * 0.55;
  // 两级插值: 正常↔俯瞰(下落) → 再被落水近景覆盖
  const mixX = tx * (1 - ov) + ovTx * ov;
  const mixY = ty * (1 - ov) + ovTy * ov;
  const mixZ = tz * (1 - ov) + ovTz * ov;
  const fx = mixX * (1 - iv) + imTx * iv;
  const fy = mixY * (1 - iv) + imTy * iv;
  const fz = mixZ * (1 - iv) + imTz * iv;

  camState.pos.x += (fx - camState.pos.x) * dt * 4;
  camState.pos.y += (fy - camState.pos.y) * dt * 5;
  camState.pos.z += (fz - camState.pos.z) * dt * 4;
  camState.bobPhase += dt * 2.5;
  const bob = Math.sin(camState.bobPhase)*0.12 + Math.sin(camState.bobPhase*1.6)*0.06;
  let shakeX=0, shakeY=0;
  if (camState.shakeT > 0) { camState.shakeT-=dt; const s=camState.shakeT*8; shakeX=(Math.random()-0.5)*s; shakeY=(Math.random()-0.5)*s; }
  camera.position.set(camState.pos.x+shakeX, camState.pos.y+bob+shakeY, camState.pos.z);
  // 看向前方——Y也跟随瀑布落差，俯视时看向筏子
  const lookZ = -CFG.cameraLookAhead;
  const lookCx = riverCenterX(lookZ);
  const lookWfY = waterfallY(lookZ);
  // 正常lookAt
  const nLookX = lookCx, nLookY = 1.8 + lookWfY + raftState.y*0.15 + bob*0.4, nLookZ = lookZ;
  // 俯视lookAt——看向筏子正下方
  const oLookX = raftCx, oLookY = wfY, oLookZ = 0;
  camera.lookAt(
    nLookX * (1 - ov) + oLookX * ov,
    nLookY * (1 - ov) + oLookY * ov,
    nLookZ * (1 - ov) + oLookZ * ov,
  );
}

const LMS = {
  lHip:23, rHip:24,
  lShoulder:11, rShoulder:12,
  lElbow:13, rElbow:14,
  lWrist:15, rWrist:16
};
async function initPose() {
  try {
    const mpPose = new window.Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}` });
    mpPose.setOptions({ modelComplexity:0, smoothLandmarks:true, enableSegmentation:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    mpPose.onResults(onPoseResults);
    const videoEl = document.createElement('video'); videoEl.setAttribute('playsinline',''); videoEl.muted = true;
    const mpCamera = new window.Camera(videoEl, { onFrame: async () => { await mpPose.send({ image: videoEl }); }, width:640, height:480 });
    await mpCamera.start();
    loadingPct.textContent = '体感摄像头已就绪';
  } catch(e) { console.warn('MediaPipe init failed', e); loadingPct.textContent = '摄像头未启用（可用键盘控制）'; }
  finally { loadingMgr.items.pose = true; loadingMgr.check(); }
}
function onPoseResults(results) {
  pctx.save(); pctx.scale(-1,1); pctx.translate(-poseCanvas.width,0);
  pctx.drawImage(results.image,0,0,poseCanvas.width,poseCanvas.height); pctx.restore();
  const lm = results.poseLandmarks;
  if (!lm) { poseData.detected=false; poseStatus.textContent='🔴'; return; }
  poseData.detected=true; poseStatus.textContent='🟢';
  const lhip=lm[LMS.lHip], rhip=lm[LMS.rHip];
  let hipMidX=(lhip.x+rhip.x)/2, hipMidY=(lhip.y+rhip.y)/2; hipMidX=1-hipMidX;
  poseData.smoothHipX=poseData.smoothHipX*0.7+hipMidX*0.3;
  let lean=(poseData.smoothHipX-0.5)*2.2; lean=Math.max(-1,Math.min(1,lean));
  // 追踪 lean 变化速率——玩家横移快，筏子横移也快
  poseData.leanVel = (lean - poseData.prevLean) * 30; // 每帧变化量 × 30fps
  poseData.prevLean = poseData.lean;
  poseData.lean=poseData.lean*0.6+lean*0.4;
  poseData.baselineY=poseData.baselineY*0.92+hipMidY*0.08;
  const now = performance.now() / 1000;
  if (poseData.jumpEndTime > 0 && now > poseData.jumpEndTime) poseData.inJump = false;
  const rise=poseData.baselineY-hipMidY;
  if (rise>0.03 && !poseData.inJump && now > (poseData.jumpEndTime + 0.3)) {
    poseData.inJump = true;
    poseData.jumpImpulse = true;
    poseData.jumpEndTime = now + 0.8; // 跳跃动画持续0.8秒
    // console.log('JUMP detected! rise=', rise.toFixed(3), 'at', now.toFixed(2));
  }

  // ===== 手臂追踪（完全跟随）=====
  const ls=lm[LMS.lShoulder], rs=lm[LMS.rShoulder];
  const lw=lm[LMS.lWrist], rw=lm[LMS.rWrist];
  const le=lm[LMS.lElbow], re=lm[LMS.rElbow];
  if (ls && rs && lw && rw) {
    // 镜像后坐标
    // 左臂：肩→腕角度 (0=向下, PI/2=水平, PI=向上)
    const lDx = (1 - lw.x) - (1 - ls.x);
    const lDy = lw.y - ls.y;
    let lArmAngle = Math.atan2(lDx, -lDy); // 0~PI, 向下到向上
    lArmAngle = Math.max(0, Math.min(Math.PI, lArmAngle));

    // 左肘弯曲量 (0=直臂, ~2.5=完全弯曲)
    let lElbow = 0;
    if (le) {
      const sex=(1-le.x)-(1-ls.x), sey=le.y-ls.y;
      const ewx=(1-lw.x)-(1-le.x), ewy=lw.y-le.y;
      const dot=sex*ewx+sey*ewy;
      const m1=Math.sqrt(sex*sex+sey*sey), m2=Math.sqrt(ewx*ewx+ewy*ewy);
      if (m1>0.001 && m2>0.001) lElbow = Math.PI - Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2))));
    }

    // 右臂
    const rDx = (1 - rw.x) - (1 - rs.x);
    const rDy = rw.y - rs.y;
    let rArmAngle = Math.atan2(rDx, -rDy);
    rArmAngle = Math.max(0, Math.min(Math.PI, rArmAngle));

    let rElbow = 0;
    if (re) {
      const sex=(1-re.x)-(1-rs.x), sey=re.y-rs.y;
      const ewx=(1-rw.x)-(1-re.x), ewy=rw.y-re.y;
      const dot=sex*ewx+sey*ewy;
      const m1=Math.sqrt(sex*sex+sey*sey), m2=Math.sqrt(ewx*ewx+ewy*ewy);
      if (m1>0.001 && m2>0.001) rElbow = Math.PI - Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2))));
    }

    // 平滑插值（轻量平滑保持响应性）
    poseData.armLZ = poseData.armLZ * 0.35 + lArmAngle * 0.65;
    poseData.armRZ = poseData.armRZ * 0.35 + rArmAngle * 0.65;
    poseData.elbowL = poseData.elbowL * 0.35 + lElbow * 0.65;
    poseData.elbowR = poseData.elbowR * 0.35 + rElbow * 0.65;
  }

  drawSkeleton(lm);
}
function drawSkeleton(lm) {
  const pw=poseCanvas.width, ph=poseCanvas.height;
  const conns=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28]];
  pctx.strokeStyle='rgba(255,210,63,.8)'; pctx.lineWidth=3; pctx.beginPath();
  for (const [a,b] of conns) { const la=lm[a], lb=lm[b]; if(!la||!lb||(la.visibility||1)<0.3||(lb.visibility||1)<0.3) continue; pctx.moveTo((1-la.x)*pw,la.y*ph); pctx.lineTo((1-lb.x)*pw,lb.y*ph); }
  pctx.stroke(); pctx.fillStyle='#4fc3f7';
  for (const idx of [0,11,12,23,24]) { const p=lm[idx]; if(!p) continue; pctx.beginPath(); pctx.arc((1-p.x)*pw,p.y*ph,4,0,Math.PI*2); pctx.fill(); }
}

function renderQuestPanel() {
  let html = '';
  for (const q of QUESTS) {
    let progress = 0, progressText = '';
    if (q.type === 'dist') { progress = Math.min(distance, q.target); progressText = `${Math.floor(progress)}/${q.target}m`; }
    else if (q.type === 'coin') { progress = Math.min(coins, q.target); progressText = `${progress}/${q.target}`; }
    else if (q.type === 'noflag-dist') { progress = Math.min(noHitDistance, q.target); progressText = `${Math.floor(progress)}/${q.target}m`; }
    const pct = Math.min(100, (progress / q.target) * 100);
    const doneClass = q.done ? ' done' : '';
    html += `<div class="quest-item${doneClass}">
      <span class="quest-icon">${q.icon}</span>
      <div class="quest-text">${q.text}<div class="quest-bar"><div class="quest-bar-fill" style="width:${pct}%"></div></div></div>
      <span class="quest-progress">${progressText}</span>
    </div>`;
  }
  questList.innerHTML = html;
}

function checkQuests(hitTaken) {
  if (hitTaken) noHitDistance = 0;
  let changed = false;
  for (const q of QUESTS) {
    if (q.done) continue;
    let complete = false;
    if (q.type === 'dist' && distance >= q.target) complete = true;
    else if (q.type === 'coin' && coins >= q.target) complete = true;
    else if (q.type === 'noflag-dist' && noHitDistance >= q.target) complete = true;
    if (complete) {
      q.done = true;
      score += q.reward;
      showQuestToast(q);
      changed = true;
    }
  }
  if (changed || Math.floor(time * 3) % 3 === 0) renderQuestPanel();
}
