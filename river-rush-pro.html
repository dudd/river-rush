// 预加载鱼和鲨鱼模型
async function loadFishModels() {
  // FBX加载helper(带失败兜底)
  const loadFBX = (path) => new Promise((res) => {
    fbxLoader.load(path, (o) => res(o), undefined, () => { console.warn('FBX加载失败:', path); res(null); });
  });
  const [mackerel, tuna, shark, mantaRaw, fish3Raw] = await Promise.all([
    loadGLB('assets/models/pirate/Prop_Fish_Mackerel.gltf'),
    loadGLB('assets/models/pirate/Prop_Fish_Tuna.gltf'),
    loadGLB('assets/models/pirate/Characters_Shark.gltf'),
    loadFBX('assets/models/fish/MantaRay.fbx'),
    loadFBX('assets/models/fish/Fish3.fbx'),
  ]);
  fishModels.fish1 = mackerel;
  fishModels.fish2 = tuna;
  fishModels.shark = shark;

  // 蒙皮烘焙(鲨鱼同款): FBX/GLB蒙皮模型的骨骼绑定与静止位姿/动画轨道
  // 单位不一致 → 蒙皮顶点爆炸到1e300(node实测) → 渲染不可见
  // 原始顶点=正确的绑定姿势形状, 烘焙成普通Mesh永久解决; 游动感用程序动画
  function bakeSkinned(root) {
    const skinned = [];
    root.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
    for (const o of skinned) {
      const m = new THREE.Mesh(o.geometry, o.material);
      m.name = o.name;
      m.castShadow = true; m.receiveShadow = true;
      m.position.copy(o.position); m.quaternion.copy(o.quaternion); m.scale.copy(o.scale);
      o.parent.add(m);
      o.parent.remove(o);
    }
  }
  // FBX鱼归一化: 运行时测包围盒→长轴转Z→按目标长度定标(现实比例参照人高≈1.55单位)
  function normalizeFish(raw, targetLen, widthMul) {
    if (!raw) return null;
    const box = new THREE.Box3().setFromObject(raw);
    const s = box.getSize(new THREE.Vector3());
    const long = s.x >= s.y && s.x >= s.z ? 0 : (s.y >= s.z ? 1 : 2);
    const g = new THREE.Group();
    g.add(raw);
    if (long === 1) raw.rotation.x = -Math.PI / 2;       // 文件内鱼是竖的(脊柱Y) → 放平到Z
    else if (long === 0) raw.rotation.y = Math.PI / 2;   // X长轴 → Z(同现有鱼)
    if (widthMul) raw.scale.x *= widthMul;               // 加宽(防太窄看不见)
    const box2 = new THREE.Box3().setFromObject(g);
    const s2 = box2.getSize(new THREE.Vector3());
    const k = targetLen / Math.max(s2.z, 0.001);
    g.scale.setScalar(k);
    console.log('鱼归一化:', raw.name || '?', '原尺寸', s.x.toFixed(2), s.y.toFixed(2), s2.z.toFixed(2), '长轴', 'XYZ'[long], '→ 缩放', k.toFixed(3), '目标长', targetLen);
    return g;
  }
  if (mantaRaw) bakeSkinned(mantaRaw);
  if (fish3Raw) bakeSkinned(fish3Raw);
  // 蝠鲼: 用户要求两倍人的大小(人高≈1.55) → 全长3.1单位
  fishModels.manta = normalizeFish(mantaRaw, 3.1);
  // Fish3: 小鱼(≈1.1单位, 略小于现有鱼), 宽度×2防太窄
  fishModels.fish3 = normalizeFish(fish3Raw, 1.1, 2);
  // 新鱼材质质感(模板上做一次, clone共享): 保留原贴图只加光泽
  for (const key of ['manta', 'fish3']) {
    if (fishModels[key]) fishModels[key].traverse(o => {
      if (o.isMesh && o.material && !Array.isArray(o.material)) {
        o.material.roughness = 0.3;
        o.material.envMapIntensity = 1.0;
        if (key === 'manta') {
          // 蝠鲼专属: 提亮+强反光(水 поверхности下清晰可见)
          o.material.color.offsetHSL(0, 0.05, 0.18);
          o.material.roughness = 0.2;        // 锐利湿滑高光
          o.material.metalness = 0.35;       // 金属反射
          o.material.envMapIntensity = 1.5;  // 天空环境强反射
          o.material.emissive = new THREE.Color(0x2e4a58);
          o.material.emissiveIntensity = 0.45;
        }
      }
    });
  }
  if (shark) {
    // 关键修复: 鲨鱼是SkinnedMesh(蒙皮), 各种clone方式渲染都会坍缩/不可见
    // 我们不给鲨鱼播骨骼动画 → 直接烘焙成普通静态Mesh(原始顶点=绑定位姿形状)
    const skinned = [];
    shark.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
    for (const o of skinned) {
      const m = new THREE.Mesh(o.geometry, o.material);
      m.name = o.name;
      m.castShadow = true; m.receiveShadow = true;
      m.position.copy(o.position); m.quaternion.copy(o.quaternion); m.scale.copy(o.scale);
      o.parent.add(m);
      o.parent.remove(o);
    }
    // 质感: 湿滑光泽——低粗糙度出锐利高光, 金属度+envMapIntensity出反光
    // (scene.environment=Sky的PMREM已全局生效, 只需调参数)
    shark.traverse(o => {
      if (o.isMesh && o.material) {
        o.material.roughness = 0.22;   // 锐利镜面高光
        o.material.metalness = 0.3;    // 金属反射
        o.material.envMapIntensity = 1.1;
        o.material.color.offsetHSL(0, 0, 0.22);
        o.material.emissive = new THREE.Color(0x3a4a5c);
        o.material.emissiveIntensity = 0.5;
      }
    });
  }
  console.log('Fish models loaded:', !!mackerel, !!tuna, !!shark);
}
loadFishModels();

function spawnFish() {
  // 确保模型已加载
  // 物种抽取: 鲨鱼25% / 蝠鲼20% / Fish3鱼群25% / 原鱼30%
  const roll = Math.random();
  const kind = roll < 0.25 ? 'shark' : roll < 0.45 ? 'manta' : roll < 0.72 ? 'fish3'
    : (Math.random() < 0.5 ? 'fish1' : 'fish2');
  const isShark = kind === 'shark';
  let model;
  let modelScale;
  if (kind === 'shark' && fishModels.shark) {
    // 鲨鱼是蒙皮模型(SharkArmature+骨骼)，必须用SkeletonUtils.clone
    model = SkeletonUtils.clone(fishModels.shark);
    modelScale = 0.3;
  } else if (kind === 'manta' && fishModels.manta) {
    model = SkeletonUtils.clone(fishModels.manta); // FBX蒙皮鱼必须SkeletonUtils.clone
  } else if (kind === 'fish3' && fishModels.fish3) {
    model = SkeletonUtils.clone(fishModels.fish3);
  } else {
    const fishModel = kind === 'fish2' ? fishModels.fish2 : fishModels.fish1;
    if (!fishModel) { fishTimer = 3; return; } // 模型未加载，3秒后重试
    model = fishModel.clone(true);
    modelScale = 0.4 + Math.random() * 0.2;
  }
  if (!model) { fishTimer = 3; return; }

  // 修复材质——原鱼重新着色(鲜艳); manta/fish3保留FBX原贴图(载入时已加光泽)
  if (!isShark && (kind === 'fish1' || kind === 'fish2')) {
    const fishColors = [0xff4444, 0xff8800, 0xffdd00, 0x44ff44, 0x44ddff, 0xff44ff, 0xff66aa];
    const fishColor = fishColors[Math.floor(Math.random() * fishColors.length)];
    model.traverse(o => {
      if (o.isMesh) {
        o.material = new THREE.MeshStandardMaterial({
          color: fishColor,
          roughness: 0.22,          // 湿滑鱼身: 锐利高光
          metalness: 0.35,          // 反光
          envMapIntensity: 1.2,     // Sky环境反射
          emissive: fishColor,
          emissiveIntensity: 0.3,
        });
      }
    });
  } else if (isShark) {
    // 材质已在loadFishModels里提亮过(clone共享材质)，这里不再改
  }
  if (isShark) {
    // 鲨鱼长轴=Z(5.63原始)，×3.3≈7单位(×1.5放大后)
    model.scale.set(modelScale * 3.96, modelScale * 5.4, modelScale * 4.95); // 再×1.2: 长约8.4单位
  } else if (kind === 'manta' || kind === 'fish3') {
    // FBX新鱼: 现实比例已在load时归一(蝠鲼6.5/Fish3 1.1宽×2), 不再缩放
  } else {
    model.scale.set(modelScale * 1.3, modelScale * 1.7, modelScale * 3.6); // 鱼群调小(1.8,2.4,5.0→1.3,1.7,3.6)
  }

  // 鱼群数量: 鲨鱼1 / 蝠鲼2~3条一群 / Fish3 10几条一群 / 原鱼3~6
  const count = isShark ? 1
    : kind === 'manta' ? 2 + Math.floor(Math.random() * 2)
    : kind === 'fish3' ? 10 + Math.floor(Math.random() * 5)
    : (3 + Math.floor(Math.random() * 4));
  // 鱼类只在宽阔水域出现——在生成区间采样, 选河宽最大处
  function pickWideSpawnZ(zMin, zMax) {
    let best = zMin, bestW = -1;
    for (let z = zMin; z <= zMax; z += 5) {
      const w = riverHalfWidth(z);
      if (w > bestW) { bestW = w; best = z; }
    }
    return { z: best, w: bestW };
  }
  // 鲨鱼带[-130,-80](雾远端浮现); 鱼带[-110,-40]
  const band = isShark
    ? pickWideSpawnZ(-130, -80)
    : pickWideSpawnZ(-110, -40);
  if (band.w < 8) {
    // 前方整段都偏窄(半宽<8) → 等2秒, 等宽河段滚进视野再生成
    fishTimer = 2;
    return;
  }
  const spawnZ = band.z;
  const cx = riverCenterX(spawnZ);
  const hw = riverHalfWidth(spawnZ);
  const wfY = waterfallY(spawnZ);
  // 横向游动方向（左→右 或 右→左）
  const direction = Math.random() < 0.5 ? 1 : -1;

  for (let i = 0; i < count; i++) {
    // 蝠鲼/Fish3是FBX蒙皮模型(带游动动画), 必须SkeletonUtils.clone(鲨鱼教训)
    const fish = (isShark || kind === 'manta' || kind === 'fish3') ? SkeletonUtils.clone(model) : model.clone(true);
    // 以河道中心为参照的偏移量——跟随河道弯曲，永不游出河
    const xOff = direction > 0
      ? -hw * 0.6 + (i / count) * hw * 1.2
      : hw * 0.6 - (i / count) * hw * 1.2;
    fish.position.set(
      cx + xOff,
      -1.5 + wfY + (Math.random() - 0.5) * 0.3,
      spawnZ + (Math.random() - 0.5) * 15
    );
    // 朝向：鱼用PI/2(长轴=X)；鲨鱼用0(实测长轴=Z, 流线正对船=相向而行)
    // 注意: 上次鲨鱼改PI/2后"又看不见"——横置+侧面对镜头高速掠过难察觉, 0才可见
    fish.rotation.y = (isShark || kind === 'manta' || kind === 'fish3')
      ? 0  // 新FBX鱼归一后长轴=Z(同鲨鱼流线朝向)
      : Math.PI / 2 + direction * 0.25; // 原鱼长轴=X, 实测颌骨bind位Z=+1.58→rotation=0正对玩家
    fish.userData = {
      isFish: true,
      isShark, // 鲨鱼威胁标记
      kind,
      direction,
      xOff,
      // 鲨鱼主动冲刺(8~12)；蝠鲼最慢(1.2~2.2)；其他鱼再放慢(2~4)
      upstreamSpeed: isShark ? 8 + Math.random() * 4
        : kind === 'manta' ? 1.2 + Math.random() * 1
        : 2 + Math.random() * 2,
      bob: Math.random() * Math.PI * 2,
      baseZ: fish.position.z,
      lifetime: 0
    };
    // FBX蒙皮已烘焙成静态Mesh(骨骼绑定坏, node实测蒙皮顶点1e300爆炸)
    // 游动感由update里的程序动画提供: 蝠鲼振翅(滚转), 鱼摆尾
    if (kind === 'manta') {
      fish.position.y = -1.8 + wfY + (Math.random() - 0.5) * 0.5; // 蝠鲼深滑
    }
    if (isShark) {
      // 跳跃方案: 'over'=越过头顶落入后方 / 'front'=前方落水
      fish.userData.jumpPlan = Math.random() < 0.5 ? 'over' : 'front';
      // 鲨鱼只露背鳍: 顶点轮廓实测鳍尖raw1.29/背部0.5 → 水线raw0.85
      // y = -0.85×scaleY(1.62) ≈ -1.4, 鳍尖露出约0.7单位, 身体全沉
      fish.position.y = -1.4 + wfY;
    }
    scene.add(fish);
    fishObjects.push(fish);
  }
  console.log(isShark ? '🦈 鲨鱼出现!' : '🐟 鱼群出现(' + kind + '×' + count + ')');
}

function update(dt) {
  time += dt;

  // 水面顶点跟随河流弯曲 + 瀑布落差——每帧更新顶点位置
  const wPos = waterGeo.attributes.position;
  for (let i = 0; i <= waterSegments; i++) {
    const z = (i / waterSegments) * 600 - 300;
    const cx = riverCenterX(z);
    const hw = riverHalfWidth(z);
    const wfY = waterfallY(z); // 瀑布处水面下降
    for (let j = 0; j <= 2; j++) {
      const idx = i * 3 + j;
      const t = j / 2;
      const x = cx + (t - 0.5) * 2 * hw;
      wPos.setX(idx, x);
      // y跟随瀑布落差，加上波纹
      const waveRipple = Math.sin(time*1.5 + z*0.1 + t*Math.PI)*0.06;
      wPos.setY(idx, wfY + waveRipple);
    }
  }
  wPos.needsUpdate = true;

  // 河床跟随河流弯曲 + 瀑布落差
  const bPos = riverbed.geometry.attributes.position;
  for (let i = 0; i <= waterSegments; i++) {
    const z = (i / waterSegments) * 600 - 300;
    const cx = riverCenterX(z);
    const hw = riverHalfWidth(z);
    const wfY = waterfallY(z);
    for (let j = 0; j <= 4; j++) {
      const idx = i * 5 + j;
      const t = j / 4;
      const x = cx + (t - 0.5) * 2 * (hw + 5);
      bPos.setX(idx, x);
      bPos.setY(idx, -1.8 + wfY);
    }
  }
  bPos.needsUpdate = true;
  if ((frameCount & 1) === 0) riverbed.geometry.computeVertexNormals(); // 法线隔帧(视觉无差)

  // 地形顶点跟随瀑布落差 + 河流弯曲——同时更新X和Y
  // 左岸：j=0 是河道边缘（跟随河流弯曲），j>0 向外延伸
  const tPos = canyonTerrain.geometry.attributes.position;
  const segs = 400, wSegs = 20, wid = 80, overlap = 4; // 与createCanyonTerrain的segs保持一致(150→400)
  // 左岸
  for (let i = 0; i <= segs; i++) {
    const z = (i / segs) * 600 - 300;
    const wfOff = waterfallHeightOffset(z);
    const cxL = riverCenterX(z), hwL = riverHalfWidth(z); // 外提: 原内层每j重复调用
    const edgeX = cxL - hwL + overlap;
    const waveA = Math.sin(z * 0.015); // 外提
    for (let j = 0; j <= wSegs; j++) {
      const idx = i * (wSegs + 1) + j;
      // X跟随河流弯曲
      const newX = edgeX - (j / wSegs) * (wid + overlap);
      tPos.setX(idx, newX);
      if (j === 0) {
        tPos.setY(idx, -1.5 - wfOff);
      } else {
        const d = Math.max(0, Math.abs(newX - cxL) - hwL);
        let h = Math.min(d * d * 0.04, 14) + waveA * Math.min(d * 0.3, 1.0);
        tPos.setY(idx, h - wfOff);
      }
    }
  }
  // 右岸
  const baseIdx = (segs + 1) * (wSegs + 1);
  for (let i = 0; i <= segs; i++) {
    const z = (i / segs) * 600 - 300;
    const wfOff = waterfallHeightOffset(z);
    const cxR = riverCenterX(z), hwR = riverHalfWidth(z); // 外提
    const edgeX = cxR + hwR - overlap;
    const waveA = Math.sin(z * 0.015); // 外提
    for (let j = 0; j <= wSegs; j++) {
      const idx = baseIdx + i * (wSegs + 1) + j;
      const newX = edgeX + (j / wSegs) * (wid + overlap);
      tPos.setX(idx, newX);
      if (j === 0) {
        tPos.setY(idx, -1.5 - wfOff);
      } else {
        const d = Math.max(0, Math.abs(newX - cxR) - hwR);
        let h = Math.min(d * d * 0.04, 14) + waveA * Math.min(d * 0.3, 1.0);
        tPos.setY(idx, h - wfOff);
      }
    }
  }
  tPos.needsUpdate = true;
  if ((frameCount & 1) === 0) canyonTerrain.geometry.computeVertexNormals(); // 法线隔帧(视觉无差)

  // 河流曲线滚动——让弯曲随玩家前进移动
  const effSpeed = speed * (power.boost > 0 ? 1.5 : 1); // A1 加速道具
  const scrollDist = (gameState===ST.PLAYING ? effSpeed : CFG.baseSpeed*0.3) * dt;
  riverPhase += scrollDist;

  // 白云飘动——跟随滚动 + 漂移 + 淡入淡出(不突然出现/消失)
  for (const cl of clouds) {
    cl.userData.baseZ += scrollDist;
    // Z范围: -400 ~ 400, 超出则环绕
    if (cl.userData.baseZ > 400) cl.userData.baseZ -= 800;
    cl.position.z = cl.userData.baseZ;
    cl.position.x += cl.userData.drift * dt;
    // 根据Z位置计算淡入淡出: 边缘100单位内渐变
    const zFade = Math.min(1, Math.abs(cl.userData.baseZ) / 100);
    cl.material.opacity = cl.userData.targetOpacity * zFade;
  }

  // C4 鸟群——横穿天空 + 慢速视差滚动 + 拍翅
  birdTimer -= dt;
  if (birdTimer <= 0) { spawnBirdFlock(); birdTimer = 22 + Math.random() * 22; }
  for (let i = birdFlocks.length - 1; i >= 0; i--) {
    const fl = birdFlocks[i];
    fl.position.x += fl.userData.dir * fl.userData.speed * dt;
    fl.userData.baseZ += scrollDist * 0.3; // 视差：比地面滚动慢
    fl.position.z = fl.userData.baseZ;
    for (const b of fl.children) {
      const flap = Math.sin(time * 9 + b.userData.flapPhase) * 0.55;
      b.userData.wings[0].rotation.z = flap;
      b.userData.wings[1].rotation.z = -flap;
    }
    if (Math.abs(fl.position.x) > 140 || fl.position.z > 15) { scene.remove(fl); birdFlocks.splice(i, 1); }
  }

  // C4 蜻蜓——贴水悬飞，四翼快拍（wings在创建时保留在userData里）
  for (const d of dragonflies) {
    d.userData.phase += dt * 6;
    d.userData.wander += dt * 0.5;
    d.position.x = d.userData.anchorX + Math.sin(d.userData.wander) * 2.5;
    d.position.z = d.userData.anchorZ + Math.cos(d.userData.wander * 0.7) * 2;
    d.position.y = 0.9 + Math.sin(d.userData.phase * 0.6) * 0.35;
    d.rotation.y = d.userData.wander + Math.PI / 2;
    const flap = Math.sin(time * 40 + d.userData.phase) * 0.7;
    d.userData.wings[0].rotation.z = flap; d.userData.wings[1].rotation.z = -flap;
    d.userData.wings[2].rotation.z = -flap; d.userData.wings[3].rotation.z = flap;
  }

  for (const v of vegObjects) {
    v.userData.baseZ += scrollDist;
    if (v.userData.baseZ > 300) {
      v.userData.baseZ -= 600;
      if (v.userData.side !== 0) v.userData.xOff = 0.5 + Math.random() * 12;
    }
    const bz = v.userData.baseZ;
    const cx = riverCenterX(bz);
    const hw = riverHalfWidth(bz);
    if (v.userData.side === 0) {
      // 水面物体（睡莲）——在河中央附近漂浮，跟随瀑布落差
      v.position.x = cx + (v.userData.xOff || 0) * (hw - 1.5);
      v.position.z = bz;
      v.position.y = 0.05 + waterfallY(bz);
    } else {
      const newX = cx + v.userData.side * (hw + v.userData.xOff);
      v.position.x = newX;
      v.position.z = bz;
      v.position.y = terrainHeight(newX, bz);
    }
  }

  // 滚动瀑布位置
  scrollWaterfalls(scrollDist);

  // 瀑布粒子——跟随滚动位置更新
  for (const wf of waterfalls) {
    if (wf.userData.idx === undefined) continue;
    const bz = waterfallZList[wf.userData.idx];
    const cx = riverCenterX(bz);
    const hw = riverHalfWidth(bz);
    const wfTopY = 0;
    const wfBotY = -WATERFALL_DROP;

    if (wf.userData.isCurtain) {
      // 水帘已删除——此分支永不触发，保留仅为兼容
    } else if (wf.userData.splash) {
      // 落水水花——底部弹跳：向上抛+重力，落回底部重新起跳
      const pos = wf.geometry.attributes.position;
      const vel = wf.userData.vel;
      for (let i = 0; i < wf.userData.count; i++) {
        vel[i*3+1] -= 12 * dt;
        pos.array[i*3] += vel[i*3] * dt;
        pos.array[i*3+1] += vel[i*3+1] * dt;
        pos.array[i*3+2] += vel[i*3+2] * dt;
        if (pos.array[i*3+1] < wfBotY - 0.2) {
          pos.array[i*3] = cx + (Math.random()-0.5) * hw * 1.8;
          pos.array[i*3+1] = wfBotY + Math.random() * 0.3;
          pos.array[i*3+2] = bz + (Math.random()-0.5) * 4;
          vel[i*3+1] = 2 + Math.random() * 4.5;
          vel[i*3] = (Math.random()-0.5) * 2;
          vel[i*3+2] = (Math.random()-0.5) * 2;
        }
      }
      pos.needsUpdate = true;
    } else if (wf.userData.vel) {
      // 水帘粒子
      const pos = wf.geometry.attributes.position;
      const vel = wf.userData.vel;
      for (let i = 0; i < wf.userData.count; i++) {
        pos.array[i*3] = cx + (Math.random()-0.5) * hw * 1.8;
        pos.array[i*3+1] += vel[i*3+1] * dt;
        if (pos.array[i*3+1] < wfBotY) pos.array[i*3+1] = wfTopY + Math.random() * 2;
        pos.array[i*3+2] = bz + (Math.random()-0.5) * WATERFALL_HALF_WIDTH;
      }
      pos.needsUpdate = true;
    } else if (wf.userData.count !== undefined) {
      // 水雾粒子
      const pos = wf.geometry.attributes.position;
      for (let i = 0; i < wf.userData.count; i++) {
        pos.array[i*3] = cx + (Math.random()-0.5) * hw * 2.5;
        pos.array[i*3+1] = wfBotY + Math.random() * 4;
        pos.array[i*3+2] = bz - WATERFALL_HALF_WIDTH + Math.random() * 8;
      }
      pos.needsUpdate = true;
    }
  }

  // 3D 角色动画 + 体感追踪（在游戏状态检查之前，确保始终运行）
  if (mixer) mixer.update(dt);
  if (characterModel) {
    // 根据跳跃状态切换动画
    let anim = 'idle';
    const nowSec = performance.now() / 1000;
    if (gameState === ST.PLAYING) {
      if (poseData.inJump || nowSec < poseData.jumpEndTime) {
        anim = 'jumping';
      } else {
        anim = 'idle';
      }
    }
    const lastAnim = characterModel.userData.lastAnim || '';
    if (anim !== lastAnim) {
      console.log('Anim switch:', lastAnim, '→', anim, '| inJump:', poseData.inJump, 'jumpEnd:', poseData.jumpEndTime.toFixed(2), 'now:', nowSec.toFixed(2));
      characterModel.userData.lastAnim = anim;
    }
    switchAnim(anim);

    // 身体倾斜——跟随玩家左右倾斜（FBX动画基础上叠加）
    // FBX骨骼名无冒号: mixamorigSpine, mixamorigSpine1, mixamorigHead
    const spineBone = charBones['mixamorigSpine'] || charBones['mixamorig:Spine'] || charBones['Spine'] || charBones['Torso'];
    if (spineBone) spineBone.rotation.z = poseData.lean * 0.3;
    const spine1Bone = charBones['mixamorigSpine1'] || charBones['mixamorig:Spine1'] || charBones['Spine1'] || charBones['Abdomen'];
    if (spine1Bone) spine1Bone.rotation.z = poseData.lean * 0.2;
    const headBone = charBones['mixamorigHead'] || charBones['mixamorig:Head'] || charBones['Head'];
    if (headBone) headBone.rotation.z = poseData.lean * 0.15;

    // C6 划桨动画——倾斜时对应侧手臂前后划动（四元数叠加在FBX动画之上，不破坏原姿势）
    {
      const leanSig = poseData.detected ? poseData.lean : raftState.x / CFG.raftMaxOffset;
      const wantStroke = Math.abs(leanSig) > 0.12 ? 1 : 0;
      raftState.strokeBlend = (raftState.strokeBlend || 0) + (wantStroke - (raftState.strokeBlend || 0)) * Math.min(1, dt * 6);
      if (raftState.strokeBlend > 0.02) {
        const swing = Math.sin(time * 5.5) * 0.7 * raftState.strokeBlend;
        const strokeL = leanSig < 0 ? swing : swing * 0.3;  // 左倾→左手主划
        const strokeR = leanSig > 0 ? swing : swing * 0.3;  // 右倾→右手主划
        const armL = charBones['mixamorigLeftArm'] || charBones['mixamorig:LeftArm'];
        const armR = charBones['mixamorigRightArm'] || charBones['mixamorig:RightArm'];
        const foreL = charBones['mixamorigLeftForeArm'] || charBones['mixamorig:LeftForeArm'];
        const foreR = charBones['mixamorigRightForeArm'] || charBones['mixamorig:RightForeArm'];
        if (armL) { _strokeQ.setFromAxisAngle(PADDLE_AXIS, strokeL); armL.quaternion.multiply(_strokeQ); }
        if (armR) { _strokeQ.setFromAxisAngle(PADDLE_AXIS, strokeR); armR.quaternion.multiply(_strokeQ); }
        if (foreL) { _strokeQ.setFromAxisAngle(PADDLE_AXIS, strokeL * 0.5); foreL.quaternion.multiply(_strokeQ); }
        if (foreR) { _strokeQ.setFromAxisAngle(PADDLE_AXIS, strokeR * 0.5); foreR.quaternion.multiply(_strokeQ); }
      }
    }
  }

  if (gameState !== ST.PLAYING) {
    splashParticles.update(dt); goldParticles.update(dt); updateCamera(dt, time);
    return;
  }

  // 当前位置的河流宽度 → 影响速度
  currentRiverWidth = riverHalfWidth(0);
  const widthRatio = CFG.baseRiverHalfWidth / currentRiverWidth; // 窄→>1→快，宽→<1→慢
  const targetSpeed = (CFG.baseSpeed + Math.min(CFG.maxSpeed - CFG.baseSpeed, distance / 220)) * widthRatio
    + (difficulty === 'hard' ? 3 : 0); // B4 困难整体提速
  speed += (targetSpeed - speed) * dt * 0.5;
  speed = Math.max(8, Math.min(CFG.maxSpeed, speed));
  distance += speed * dt;
  noHitDistance += speed * dt;
  score += Math.floor(speed * dt * 0.5);
  checkQuests(false);

  // B3 场景阶段切换——每1000m: 峡谷→雨林(雨)→雾林, 3秒渐变
  const stageIdx = Math.floor(distance / 1000) % STAGES.length;
  if (stageIdx !== stageState.idx) {
    stageState.idx = stageIdx;
    const s = STAGES[stageIdx];
    stageState.tgt = { bg: new THREE.Color(s.bg), water: new THREE.Color(s.water), terrain: new THREE.Color(s.terrain), fogC: new THREE.Color(s.fogC), fogN: s.fogN, fogF: s.fogFar, sun: s.sun, hemi: s.hemi };
    stageState.rainOn = s.rain;
    stageBanner.textContent = s.name;
    stageBanner.style.opacity = '1';
    stageState.bannerT = 3;
  }
  if (stageState.tgt) {
    const k = Math.min(1, dt * 0.8);
    const cur = stageState.cur;
    cur.bg.lerp(stageState.tgt.bg, k);
    cur.water.lerp(stageState.tgt.water, k);
    cur.terrain.lerp(stageState.tgt.terrain, k);
    cur.fogC.lerp(stageState.tgt.fogC, k);
    cur.fogN += (stageState.tgt.fogN - cur.fogN) * k;
    cur.fogF += (stageState.tgt.fogF - cur.fogF) * k;
    cur.sun += (stageState.tgt.sun - cur.sun) * k;
    cur.hemi += (stageState.tgt.hemi - cur.hemi) * k;
    scene.background.copy(cur.bg);
    waterMat.color.copy(cur.water);
    canyonTerrain.material.color.copy(cur.terrain);
    riverbedMat.color.copy(cur.terrain);
    scene.fog.color.copy(cur.fogC);
    scene.fog.near = cur.fogN;
    scene.fog.far = cur.fogF;
    sunLight.intensity = cur.sun;
    hemiLight.intensity = cur.hemi;
  }
  // B3 雨
  rain.visible = stageState.rainOn;
  if (stageState.rainOn) {
    updateRain(dt);
    rain.position.x = raft.position.x;
  }
  if (stageState.bannerT > 0) {
    stageState.bannerT -= dt;
    if (stageState.bannerT <= 0) stageBanner.style.opacity = '0';
  }
  score += Math.floor(speed * dt * 0.5);
  checkQuests(false);

  // 急流提示（窄段）
  if (currentRiverWidth < 7) {
    rapidFx.textContent = '⚡ 急流！';
    rapidFx.style.opacity = '1';
  } else if (currentRiverWidth > 11) {
    rapidFx.textContent = '～ 平缓水域';
    rapidFx.style.opacity = '0.5';
  } else {
    rapidFx.style.opacity = '0';
  }

  // 体感/键盘 → 筏子横向移动
  const raftCx = riverCenterX(0);
  if (poseData.detected) {
    // 横移速度与玩家横移速度联动：leanVel 是 lean 的变化速率
    // 直接用速度驱动，而不是设置目标位置
    const leanSpeed = Math.max(-15, Math.min(15, poseData.leanVel));
    raftState.targetX += leanSpeed * dt;
    // 也用 lean 值作为偏置，保证最终位置和身体位置对应
    raftState.targetX += (poseData.lean * CFG.raftMaxOffset - raftState.targetX) * dt * 1.5;
  }
  if (keys['ArrowLeft']||keys['a']||keys['A']) raftState.targetX -= dt*18;
  if (keys['ArrowRight']||keys['d']||keys['D']) raftState.targetX += dt*18;
  if ((keys[' ']||keys['ArrowUp']||keys['w']||keys['W']) && raftState.onWater) {
    raftState.vy=10; raftState.onWater=false; raftState.bounceT=0.3;
  }
  raftState.targetX = Math.max(-CFG.raftMaxOffset, Math.min(CFG.raftMaxOffset, raftState.targetX));
  raftState.x += (raftState.targetX - raftState.x) * dt * 8;
  raftState.tilt = (raftState.targetX - raftState.x) * 0.05;
  if (poseData.jumpImpulse && raftState.onWater) { raftState.vy=12; raftState.onWater=false; raftState.bounceT=0.3; }
  poseData.jumpImpulse = false;

  // 瀑布视觉区——与真实瀑布位置同步触发（原来按距离触发，与1200m外的实际瀑布脱节→"隐形碰撞"）
  if (raftState.waterfallFx <= 0) {
    for (const wz of waterfallZList) {
      if (wz > -3 && wz < 3) {
        raftState.waterfallFx = 2.5;
        camState.shakeT = 0.8;
        rapidFx.textContent = '🌊 瀑布！';
        rapidFx.style.opacity = '1';
        speed = Math.min(CFG.maxSpeed, speed * 1.35);
        splashParticles.emit(raft.position.x, 1, -2, 25, 8, 8);
        break;
      }
    }
  }

  // B1 瀑布QTE跳跃——主动高光时刻
  {
    let nearWz = null;
    for (const wz of waterfallZList) if (wz > -35 && wz < 10) { nearWz = wz; break; }
    if (nearWz === null) {
      if (qte.state !== 'idle') { qte.state = 'idle'; qte.done = false; qteFx.style.opacity = '0'; qteFx.classList.remove('pulse'); }
    } else if (nearWz > -5 && nearWz < 5) {
      // 激活窗口：跳！
      if (qte.state !== 'active') { qte.state = 'active'; qteFx.textContent = '跳！！↑'; qteFx.style.opacity = '1'; qteFx.classList.add('pulse'); }
      if (!qte.done && (raftState.y > 0.4 || keys[' '])) {
        // 成功：慢动作 + 奖励
        qte.done = true;
        score += 300;
        slowmoT = 1.2;
        rapidFx.textContent = '✨ 完美飞跃！+300';
        rapidFx.style.opacity = '1';
        qteFx.style.opacity = '0'; qteFx.classList.remove('pulse');
        goldParticles.emit(raft.position.x, 1.5, 0, 30, 6, 8);
        splashParticles.emit(raft.position.x, 0.5, -2, 25, 8, 8);
      }
    } else if (nearWz >= -30) {
      // 预备提示
      if (qte.state === 'idle') { qte.state = 'ready'; qteFx.textContent = '瀑布将至——准备跳！'; qteFx.style.opacity = '0.85'; qteFx.classList.remove('pulse'); }
    }
  }
  if (raftState.waterfallFx > 0) {
    raftState.waterfallFx -= dt;
    if (raftState.waterfallFx <= 0) {
      raftState.waterfallFx = 0;
      rapidFx.style.opacity = '0';
    }
  }

  if (!raftState.onWater) {
    raftState.vy -= 28*dt; raftState.y += raftState.vy*dt;
    if (raftState.y <= 0) { raftState.y=0; raftState.vy=0; raftState.onWater=true; raftState.bounceT=0.25; splashParticles.emit(raft.position.x, 0.5, 0, 10, 5, 5); }
  }
  if (raftState.bounceT > 0) raftState.bounceT -= dt;

  // 筏子位置（跟随河流弯曲中心 + 横向偏移 + 瀑布落差）
  const wfY = waterfallY(0); // 当前位置的水面Y（瀑布处下降）
  const waveY = Math.sin(time*1.5 + raftState.x*0.3)*0.15 + Math.sin(time*2.2)*0.08;
  const bobY = raftState.onWater ? waveY : raftState.y;
  raft.position.x = raftCx + raftState.x;
  raft.position.y = 0.4 + bobY + wfY; // 加上瀑布落差
  // 筏子朝向河流方向（瀑布区时前倾）
  const raftDir = riverDirection(0);
  raft.rotation.z = raftState.tilt;
  raft.rotation.x = raftState.onWater ? Math.sin(time*1.3)*0.04 : 0;
  if (raftState.waterfallFx > 1.5) raft.rotation.x += 0.25; // 进入瀑布时前倾
  raft.rotation.y = raftDir + raftState.tilt * 0.15;

  // 桨动画
  const ud = raft.userData;
  if (ud.paddleL) { const phase=time*4; ud.paddleL.rotation.x=Math.sin(phase)*0.3; ud.paddleR.rotation.x=-Math.sin(phase)*0.3; }

  // 物体沿弯曲路径移动
  for (const o of gameObjects) {
    o.userData.baseZ += effSpeed * dt;
    o.position.z = o.userData.baseZ;
    // 横向跟随河流弯曲
    const objCx = riverCenterX(o.userData.baseZ);
    const objHw = riverHalfWidth(o.userData.baseZ);
    const lateralRatio = o.userData.lateralRatio !== undefined ? o.userData.lateralRatio : (() => {
      o.userData.lateralRatio = (o.position.x - riverCenterX(o.userData.baseZ)) / Math.max(1, riverHalfWidth(o.userData.baseZ));
      return o.userData.lateralRatio;
    })();
    o.position.x = objCx + lateralRatio * (objHw - 1);
    // Y跟随瀑布落差——防止物体飞在天上
    const objWfY = waterfallY(o.userData.baseZ);
    if (o.userData.type==='coin' || o.userData.type==='heart' || o.userData.type==='power') {
      o.rotation.y += dt*3;
      o.position.y = 1.3 + Math.sin(time*2 + o.userData.spin)*0.2 + objWfY;
      // 金币光晕球: 呼吸脉动(球体shader全角度可见, 无需billboard)
      if (o.userData.type==='coin' && o.userData.glow) {
        o.userData.glow.material.uniforms.uOpacity.value = 0.55 + 0.2 * (0.5 + 0.5 * Math.sin(time * Math.PI * 1.9 * 0.5));
      }
    } else {
      // 岩石/浮木抬高出水面(0.55)，不再半浸水中难以辨认
      o.position.y = 0.55 + objWfY;
    }
    // A1 磁铁：金币/爱心被吸向船（修正lateralRatio才能持续生效）
    if (power.magnet > 0 && (o.userData.type==='coin' || o.userData.type==='heart') && o.position.z > -16) {
      const targetRatio = (raft.position.x - objCx) / Math.max(1, objHw);
      o.userData.lateralRatio += (targetRatio - o.userData.lateralRatio) * Math.min(1, dt * 4);
      o.position.x = objCx + o.userData.lateralRatio * (objHw - 1);
      o.userData.baseZ += 10 * dt;
    }
  }

  // 碰撞——树桩和石头是障碍物，金币和爱心是奖励，道具是增益
  for (const o of gameObjects) {
    if (o.userData.hit) continue;
    if (o.position.z < -1.5 || o.position.z > 1.5) continue;
    const dx = Math.abs(o.position.x - raft.position.x);
    if (dx > o.userData.w + 0.8) continue;
    if (o.userData.type==='rock' || o.userData.type==='log') {
      if (raftState.y > 1.2) continue;
      if (power.boost > 0) continue; // A1 加速中无敌
      if (power.shield) {
        // A1 护盾抵挡一次
        power.shield = false; shieldBubble.visible = false;
        invuln = 1.2; camState.shakeT = 0.3;
        goldParticles.emit(raft.position.x, 1.2, 0, 20, 5, 6);
        rapidFx.textContent = '🛡️ 护盾抵挡！'; rapidFx.style.opacity = '1';
        setTimeout(() => { rapidFx.style.opacity = '0'; }, 1000);
      } else if (invuln <= 0) {
        o.userData.hit=true; lives--; invuln=1.5; camState.shakeT=0.4; speed*=0.45;
        splashParticles.emit(raft.position.x, 1, 0, 15, 6, 6);
        checkQuests(true);
      }
    } else if (o.userData.type==='coin') {
      o.userData.hit=true; coins++;
      // A3 连击：2.5秒内连续收集，倍率最高×2
      combo.count++; combo.timer = 2.5;
      combo.mult = 1 + Math.min(combo.count, 10) * 0.1;
      score += Math.round(100 * combo.mult * (power.double > 0 ? 2 : 1));
      comboFx.textContent = `COMBO ×${combo.mult.toFixed(1)}`;
      comboFx.style.opacity = '1';
      comboFx.classList.add('pop');
      setTimeout(()=>comboFx.classList.remove('pop'), 120);
      goldParticles.emit(o.position.x, o.position.y, o.position.z, 10, 4, 4);
      checkQuests(false);
    } else if (o.userData.type==='heart') {
      o.userData.hit=true; lives=Math.min(5, lives+1); score+=50;
      goldParticles.emit(o.position.x, o.position.y, o.position.z, 8, 3, 3);
    } else if (o.userData.type==='power') {
      // A1 道具拾取
      o.userData.hit = true;
      const pt = o.userData.ptype;
      if (pt === 'magnet') { power.magnet = 10; rapidFx.textContent = '🧲 磁铁！金币自动吸附'; }
      else if (pt === 'shield') { power.shield = true; shieldBubble.visible = true; rapidFx.textContent = '🛡️ 护盾！抵挡一次撞击'; }
      else if (pt === 'boost') { power.boost = 4; rapidFx.textContent = '⚡ 冲刺！无敌加速'; }
      else { power.double = 12; rapidFx.textContent = '💰 双倍分数！'; }
      rapidFx.style.opacity = '1';
      setTimeout(() => { rapidFx.style.opacity = '0'; }, 1400);
      score += 50;
      goldParticles.emit(o.position.x, o.position.y, o.position.z, 18, 5, 7);
    }
  }

  gameObjects = gameObjects.filter(o => {
    if (o.position.z > 12 || o.userData.hit) { scene.remove(o); return false; }
    return true;
  });

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObject();
    // B4 难度节奏：简单刷得稀；困难"呼吸式"波浪(平静→密集→释放)
    let mul = difficulty === 'easy' ? 1.7 : (difficulty === 'hard' ? 0.85 : 1.0);
    if (difficulty === 'hard') {
      const phase = (distance % 400) / 400;
      const waveMul = phase < 0.35 ? 1.8 : (phase < 0.75 ? 0.5 : 1.0);
      mul *= waveMul;
    }
    spawnTimer = Math.max(0.3, (0.9 + Math.random() * 0.6 - distance / 3000) * mul);
  }
  // A1 道具生成——约22~38秒一个
  powerupTimer -= dt;
  if (powerupTimer <= 0) {
    spawnPowerup();
    powerupTimer = 22 + Math.random() * 16;
  }

  // 鱼/鲨鱼系统
  fishTimer -= dt;
  if (fishTimer <= 0) {
    spawnFish();
    fishTimer = 6 + Math.random() * 8; // 6~14秒出现一次
  }
  // A2 鲨鱼威胁追踪——鲨鱼与鱼共用同款游动(横向巡游+边界反弹)，不会撞岸
  let sharkHunting = false;
  for (const f of fishObjects) {
    f.userData.lifetime += dt;
    f.userData.bob += dt * 3;
    // 先更新Z（逆流而上 + 跟随河流滚动）
    f.userData.baseZ += f.userData.upstreamSpeed * dt;
    f.userData.baseZ += scrollDist;
    f.position.z = f.userData.baseZ;

    // 横向巡游——鱼和鲨鱼同款
    f.userData.xOff += f.userData.direction * 3 * dt;
    const hw = riverHalfWidth(f.position.z);
    if (Math.abs(f.userData.xOff) > hw * 0.7) {
      f.userData.direction *= -1;
      f.userData.xOff = Math.sign(f.userData.xOff) * hw * 0.7;
      // 鱼PI/2(长轴X)，鲨鱼0(长轴Z流线朝向)
      f.rotation.y = f.userData.isShark ? 0 : Math.PI / 2 + f.userData.direction * 0.25;
    }
    f.position.x = riverCenterX(f.position.z) + f.userData.xOff;

    if (f.userData.isShark && f.position.z > -130 && f.position.z < 3) {
      // 鲨鱼纯视觉观赏(无伤害): 只保留跳跃表演, 移动与鱼巡游一致
      sharkHunting = true;
      const jump = f.userData.jump;
      if (jump) {
        // 空中抛物线: Z脚本插值 + Y弧线 + 俯仰(起跳昂首→入水俯冲)
        jump.t += dt;
        const p = Math.min(1, jump.t / jump.dur);
        f.userData.baseZ = jump.z0 + (jump.z1 - jump.z0) * p;
        f.position.z = f.userData.baseZ;
        f.position.y = jump.y0 + jump.v0 * jump.t - 9 * jump.t * jump.t;
        f.rotation.x = -0.65 * Math.cos(Math.PI * p);
        if (p >= 1) {
          f.userData.jump = null;
          f.rotation.x = 0;
          // 落水水花
          splashParticles.emit(f.position.x, 0.3, f.position.z, 30, 5, 7);
        }
      } else if (!f.userData.jumped) {
        // 触发跳跃: over=船前起跳越过头顶 / front=远处起跳船前落水
        const trigZ = f.userData.jumpPlan === 'over' ? -11 : -26;
        if (f.position.z > trigZ) {
          const over = f.userData.jumpPlan === 'over';
          const apex = over ? 8.4 : 6.4; // 跳跃高度×2
          const v0 = Math.sqrt(36 * apex); // g=18: v0=√(2g·h)
          f.userData.jump = {
            t: 0,
            dur: (2 * v0) / 18,
            v0,
            z0: f.position.z,
            z1: over ? 5.5 : -5,
            y0: f.position.y
          };
          splashParticles.emit(f.position.x, 0.2, f.position.z, 22, 4, 6); // 起跳水花
          f.userData.jumped = true;
        }
      }
      // 冲过船后立即下潜离场——不从背后绕(跳跃中不判)
      if (f.position.z > 3 && !f.userData.jump) f.userData.lifetime = 99;
    }
    // FBX新鱼播放游动动画
    if (f.userData.mixer) f.userData.mixer.update(dt);
    // 上下浮动(跳跃中Y由抛物线控制)
    if (!f.userData.jump) {
      // 鲨鱼只露背鳍(-1.4)，蝠鲼深滑(-1.8)，普通鱼在水下(-1.5)
      const swimY = f.userData.isShark ? -1.4 : (f.userData.kind === 'manta' ? -1.8 : -1.5); // 鲨鱼只露背鳍(鳍尖raw1.29/背0.5→水线0.85)
      f.position.y = swimY + waterfallY(f.position.z) + Math.sin(f.userData.bob) * 0.15;
      // 身体摆动: 蝠鲼振翅(滚转±0.2), 其他鱼轻微摆尾
      f.rotation.z = Math.sin(f.userData.bob * (f.userData.kind === 'manta' ? 1.5 : 2)) * (f.userData.kind === 'manta' ? 0.2 : 0.1);
    }
  }
  // A2 鲨鱼警告UI
  sharkWarn.style.display = sharkHunting ? 'block' : 'none';
  sharkWarn.style.opacity = sharkHunting ? '1' : '0';
  // 清理超出范围的鱼
  for (let i = fishObjects.length - 1; i >= 0; i--) {
    const f = fishObjects[i];
    if (f.position.z > 12 || f.userData.lifetime > 30) {
      scene.remove(f);
      fishObjects.splice(i, 1);
    }
  }
  if (invuln > 0) invuln -= dt;
  // A3 连击倒计时
  if (combo.timer > 0) {
    combo.timer -= dt;
    if (combo.timer <= 0) { combo.count = 0; combo.mult = 1; comboFx.style.opacity = '0'; }
  }
  // A1 道具倒计时 + HUD(名称+失效进度条) + 护盾气泡脉动
  if (power.magnet > 0) power.magnet -= dt;
  if (power.boost > 0) power.boost -= dt;
  if (power.double > 0) power.double -= dt;
  shieldBubble.material.opacity = 0.12 + Math.sin(time * 5) * 0.05;
  pwMagnet.classList.toggle('on', power.magnet > 0);
  pwShield.classList.toggle('on', power.shield);
  pwBoost.classList.toggle('on', power.boost > 0);
  pwDouble.classList.toggle('on', power.double > 0);
  pwfMagnet.style.width = Math.max(0, power.magnet / 10 * 100) + '%';
  pwfBoost.style.width = Math.max(0, power.boost / 4 * 100) + '%';
  pwfDouble.style.width = Math.max(0, power.double / 12 * 100) + '%';
  const speedRatio = (speed - CFG.baseSpeed) / (CFG.maxSpeed - CFG.baseSpeed);
  speedFx.style.opacity = String(speedRatio * 0.6);
  // C2 速度FOV——速度越快视野越广，加速体感
  {
    const targetFov = 72 + Math.max(0, speedRatio) * 13;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 4);
    camera.updateProjectionMatrix();
  }
  // C1 尾迹随速度变长变浓
  {
    const wakeLen = 2.5 + Math.max(0, speedRatio) * 7;
    wakeL.scale.y = wakeLen; wakeR.scale.y = wakeLen;
    const wakeO = 0.1 + Math.max(0, speedRatio) * 0.45;
    wakeL.material.opacity = wakeO; wakeR.material.opacity = wakeO;
  }
  if (raftState.onWater && Math.random() < 0.2) splashParticles.emit(raft.position.x + (Math.random()-0.5)*2.5, 0.3, -1.5, 3, 2.5, 2.5);

  splashParticles.update(dt); goldParticles.update(dt); updateCamera(dt, time);

  scoreVal.textContent = score; distVal.textContent = Math.floor(distance)+'m';
  livesEl.textContent = '🐋'.repeat(Math.max(0,lives)) || '💔';
  const dotLeft = 50 + (poseData.detected ? poseData.lean : raftState.x/CFG.raftMaxOffset)*42;
  leanDot.style.left = dotLeft + '%';
  raft.visible = invuln <= 0 || Math.floor(invuln*12)%2===0;
  if (lives <= 0) { raft.visible=true; gameOver(); }
}

//==================================================================
// 主循环
//==================================================================
const clock = new THREE.Clock();
let frameCount = 0;
let fpsFrames = 0, fpsTime = 0;
let renderError = false;
function loop() {
  frameCount++;
  // FPS统计: 每0.5秒更新一次DOM(每帧console.log才伤性能, 2Hz文本写≈0开销)
  const rawDt = Math.min(0.05, clock.getDelta());
  fpsFrames++; fpsTime += rawDt;
  if (fpsTime >= 0.5) {
    const el = document.getElementById('fpsVal');
    if (el) el.textContent = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
  }
  // B1 慢动作：QTE成功后时间放慢再恢复
  if (slowmoT > 0) {
    slowmoT -= rawDt;
    timeScale = slowmoT > 0.35 ? 0.45 : 0.45 + (1 - Math.max(0, slowmoT) / 0.35) * 0.55;
    if (slowmoT <= 0) timeScale = 1;
  }
  const dt = rawDt * timeScale;
  try {
    if (gameState !== ST.PAUSED) {
      update(dt);
    }
    composer.render();
    // 暂停遮罩
    pauseOverlay.style.display = (gameState === ST.PAUSED) ? 'flex' : 'none';
  } catch(e) {
    if (!renderError) {
      renderError = true;
      console.error('渲染循环错误:', e);
      // 回退到直接渲染（跳过后处理）
      try { renderer.render(scene, camera); } catch(e2) { console.error('回退渲染也失败:', e2); }
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', () => { if (gameState===ST.READY) startGame(); });
restartBtn.addEventListener('click', () => { if (gameState===ST.OVER) startGame(); });

initQuestSystem();
initPose();
loop();

      if (o.isSkinnedMesh) types.push('SkinnedMesh');
      if (o.isObject3D) types.push('Object3D');
      if (types.length > 0) console.log(`  [${count}] ${o.name || 'unnamed'} types=[${types.join(',')}]`);
      if (count > 80) { console.log('  ...(truncated)'); return; }
    });
    console.log(`Total objects: ${count}`);
    console.log('charBones keys:', Object.keys(charBones));
  },

  // ===== 橡皮筏材质调试 =====
  // 获取橡皮筏所有mesh和材质
  raftParts() {
    const parts = [];
    raft.traverse(o => {
      if (o.isMesh) {
        parts.push(o);
        console.log(`[${parts.length}] ${o.name || 'unnamed'} | color=#${o.material.color?.getHexString?.()||'?'} roughness=${o.material.roughness} metalness=${o.material.metalness} envMapIntensity=${o.material.envMapIntensity}`);
      }
    });
    console.log(`共 ${parts.length} 个mesh。用 dbg.raftSet(序号, {参数}) 修改`);
    return parts;
  },
  // 设置橡皮筏某个部件的材质参数: dbg.raftSet(1, {color:0xffdd00, roughness:0.6, metalness:0, envMapIntensity:0.8})
  raftSet(idx, opts) {
    const parts = [];
    raft.traverse(o => { if (o.isMesh) parts.push(o); });
    const m = parts[idx - 1];
    if (!m) { console.log(`❌ 找不到第${idx}个mesh，共${parts.length}个`); return; }
    if (opts.color !== undefined) { m.material.color = new THREE.Color(opts.color); }
    if (opts.roughness !== undefined) m.material.roughness = opts.roughness;
    if (opts.metalness !== undefined) m.material.metalness = opts.metalness;
    if (opts.envMapIntensity !== undefined) m.material.envMapIntensity = opts.envMapIntensity;
    if (opts.emissive !== undefined) { m.material.emissive = new THREE.Color(opts.emissive); }
    if (opts.emissiveIntensity !== undefined) m.material.emissiveIntensity = opts.emissiveIntensity;
    if (opts.opacity !== undefined) { m.material.transparent = true; m.material.opacity = opts.opacity; }
    m.material.needsUpdate = true;
    console.log(`✅ [${idx}] ${m.name||'unnamed'} 已更新:`, {
      color: '#'+m.material.color.getHexString(),
      roughness: m.material.roughness,
      metalness: m.material.metalness,
      envMapIntensity: m.material.envMapIntensity,
      emissive: '#'+m.material.emissive.getHexString(),
      emissiveIntensity: m.material.emissiveIntensity,
      opacity: m.material.opacity,
    });
  },
  // 一次性设置所有橡皮筏部件: dbg.raftAll({color:0xffdd00, roughness:0.5})
  raftAll(opts) {
    let count = 0;
    raft.traverse(o => {
      if (o.isMesh) {
        count++;
        if (opts.color !== undefined) o.material.color = new THREE.Color(opts.color);
        if (opts.roughness !== undefined) o.material.roughness = opts.roughness;
        if (opts.metalness !== undefined) o.material.metalness = opts.metalness;
        if (opts.envMapIntensity !== undefined) o.material.envMapIntensity = opts.envMapIntensity;
        if (opts.emissive !== undefined) o.material.emissive = new THREE.Color(opts.emissive);
        if (opts.emissiveIntensity !== undefined) o.material.emissiveIntensity = opts.emissiveIntensity;
        if (opts.opacity !== undefined) { o.material.transparent = true; o.material.opacity = opts.opacity; }
        o.material.needsUpdate = true;
      }
    });
    console.log(`✅ 已更新全部 ${count} 个部件`, opts);
  },
  // 查看当前橡皮筏所有材质参数
  raftDump() {
    let count = 0;
    raft.traverse(o => {
      if (o.isMesh) {
        count++;
        console.log(`[${count}] ${o.name||'unnamed'}:`, {
          color: '#'+o.material.color.getHexString(),
          roughness: o.material.roughness,
          metalness: o.material.metalness,
          envMapIntensity: o.material.envMapIntensity,
          emissive: '#'+o.material.emissive.getHexString(),
          emissiveIntensity: o.material.emissiveIntensity,
          opacity: o.material.opacity,
        });
      }
    });
  }
};
</script>
